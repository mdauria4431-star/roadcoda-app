<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ratings · RoadCoda</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#070c14">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="access.js"></script>
<script src="shell.js"></script>
<style>
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px}
  button{font-family:inherit;cursor:pointer}
  .btn{height:32px;padding:0 13px;border-radius:8px;border:1px solid var(--line);font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  main{padding:14px 16px 40px!important;display:flex;flex-direction:column;gap:12px}
  .login{max-width:380px;margin:60px auto;display:flex;flex-direction:column;gap:12px;padding:20px}
  label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:12.5px}
  input,select{height:32px;border:1px solid var(--line);border-radius:8px;padding:0 9px;font-family:inherit;font-size:13px;color:var(--ink)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .card > header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line-soft);background:none;position:static;width:auto;height:auto;flex-wrap:wrap}
  .card > header h2{margin:0;font-size:11px}
  .sp{flex:1}
  .bar{display:flex;align-items:end;gap:10px;flex-wrap:wrap}
  h1{margin:0;font-size:19px}
  .mini{font-size:11.5px;color:var(--ink-3)}
  .error{color:var(--late)} .ok{color:var(--ok)}
  .empty{padding:16px;color:var(--muted);font-size:13px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .tile{padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
  .tile .k{font-family:var(--ui);font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
  .tile .v{font-family:var(--mono);font-size:22px;font-weight:600;margin-top:4px}
  .tile .s{font-size:12px;color:var(--muted);margin-top:3px}
  .tabs{display:flex;gap:6px}
  .tabs button{height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);font-weight:600}
  .tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  table.t{width:100%;border-collapse:collapse;font-size:13px}
  .t th{font-family:var(--ui);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:7px 10px;background:var(--panel-2);border-bottom:1px solid var(--line)}
  .t td{padding:8px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
  .t tr.sub td:first-child{padding-left:28px;color:var(--muted)}
  .t tr.g{cursor:pointer}
  .stars{color:#f2a900;letter-spacing:1px;white-space:nowrap}
  .dist{display:flex;height:10px;width:140px;border-radius:5px;overflow:hidden;background:var(--panel-2)}
  .dist i{display:block;height:100%}
  .avg{font-family:var(--mono);font-weight:600}
  .low{color:var(--late);font-weight:600}
</style>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <div class="brand">Road<span>Coda</span></div>
  <nav style="display:flex;gap:14px;font-size:14px"><a href="index.html">Home</a><a href="dispatch.html">Dispatch</a><a href="messages.html">Messages</a><a class="on" href="ratings.html">Ratings</a><a href="loads.html">Loads</a><a href="customers.html">Customers</a><a href="drivers.html">Drivers</a></nav>
  <div class="who" id="who"></div>
  <button class="btn small" id="signout" hidden>Sign out</button>
</header>

<main>
  <section id="login-view" class="card login" hidden>
    <h2>Sign in</h2>
    <label for="email">Email<input id="email" type="email" autocomplete="username"></label>
    <label for="password">Password<input id="password" type="password" autocomplete="current-password"></label>
    <button class="btn primary" id="login-btn">Sign in</button>
    <div class="error" id="login-error"></div>
  </section>

  <section id="app" hidden style="display:flex;flex-direction:column;gap:12px">
    <div class="bar">
      <h1>Delivery ratings</h1><span class="sp"></span>
      <label>Period<select id="period"><option value="30">Last 30 days</option><option value="90" selected>Last 90 days</option><option value="365">Last 12 months</option></select></label>
      <label style="flex-direction:row;align-items:center;gap:7px;font-weight:500" id="survey-wrap"><input type="checkbox" id="survey" style="height:auto"> Ask for ratings in Delivered emails</label>
    </div>
    <div class="tiles" id="tiles"></div>

    <div class="card" id="fu-card">
      <header><h2>Needs follow-up</h2><span class="mini">1–2 stars, until someone marks them handled</span></header>
      <div id="fu"></div>
    </div>

    <div class="card">
      <header><div class="tabs" id="tabs"><button data-by="driver" class="on">Drivers</button><button data-by="customer">Customers</button><button data-by="location">Locations</button></div>
        <span class="sp"></span><span class="mini">Only answered ratings count toward averages. Click a customer for its DCs.</span></header>
      <div id="roll"></div>
    </div>

    <div class="card">
      <header><h2>Comments</h2></header>
      <div id="comments"></div>
    </div>
  </section>
</main>

<script>
if (!window.RC_CONFIG || !/^(sb_publishable_|eyJ)/.test(RC_CONFIG.SUPABASE_KEY || '')) {
  document.body.innerHTML = '<div style="max-width:560px;margin:60px auto;padding:20px;background:#fff;border-radius:12px;font-family:system-ui">RoadCoda can\'t find config.js or its key.</div>';
  throw new Error('RoadCoda settings missing');
}
const sb = supabase.createClient(RC_CONFIG.SUPABASE_URL, RC_CONFIG.SUPABASE_KEY);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const day = (t) => t ? new Date(t).toLocaleDateString([], { month: 'numeric', day: 'numeric' }) : '';
const star = (n) => '★'.repeat(n) + '<span style="color:var(--line)">' + '★'.repeat(5 - n) + '</span>';
const COL = ['', '#c0392b', '#e67e22', '#d4ac0d', '#7fb03a', '#1e8e5a'];
const canEdit = () => !window.RC_ACCESS || window.RC_ACCESS.can('dispatch', 'edit');
let ROWS = [], BY = 'driver', OPEN = new Set(), ME = null;

async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('login-view').hidden = false; return; }
  const { data } = await sb.from('profiles').select('role, full_name, carrier_id, carriers(name, survey_enabled)').eq('user_id', session.user.id).single();
  if (!data) { $('login-view').hidden = false; $('login-error').textContent = 'This login is not linked to a carrier.'; return; }
  if (data.role === 'driver') { location.href = 'driver.html'; return; }
  ME = data;
  $('who').textContent = `${data.full_name || session.user.email} · ${data.carriers?.name || ''} · ${data.role}`;
  $('signout').hidden = false;
  await window.RC_ACCESS_READY;
  if (window.RC_ACCESS && !window.RC_ACCESS.can('dispatch')) return;
  $('app').hidden = false;
  $('survey').checked = data.carriers?.survey_enabled !== false;
  $('survey').disabled = data.role !== 'owner';
  $('survey-wrap').title = data.role === 'owner' ? '' : 'Only the owner can change this';
  load();
}
$('login-btn').onclick = async () => { const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value }); if (error) { $('login-error').textContent = error.message; return; } location.reload(); };
$('signout').onclick = async () => { await sb.auth.signOut(); location.reload(); };
$('period').onchange = load;
$('survey').onchange = async () => {
  const { error } = await sb.from('carriers').update({ survey_enabled: $('survey').checked }).eq('id', ME.carrier_id);
  if (error) { alert(error.message); $('survey').checked = !$('survey').checked; }
};
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { BY = b.dataset.by; OPEN.clear(); document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b)); drawRoll(); });

async function load() {
  const since = new Date(); since.setDate(since.getDate() - +$('period').value);
  const { data, error } = await sb.from('delivery_rating_list').select('*').gte('invited_at', since.toISOString()).order('invited_at', { ascending: false }).limit(5000);
  if (error) { $('tiles').innerHTML = `<div class="card empty error">${esc(error.message)}${/delivery_rating_list|schema cache/.test(error.message) ? ' — run 57_ratings.sql in the SQL Editor.' : ''}</div>`; return; }
  ROWS = data || [];
  const ans = ROWS.filter(r => r.score), avg = ans.length ? ans.reduce((a, r) => a + r.score, 0) / ans.length : null;
  const fu = ans.filter(r => r.score <= 2 && !r.handled_at);
  $('tiles').innerHTML = [
    ['Asked', ROWS.length, 'Delivered emails with stars'],
    ['Answered', ans.length, ROWS.length ? Math.round(ans.length / ROWS.length * 100) + '% responded' : '—'],
    ['Average', avg ? avg.toFixed(2) + ' ★' : '—', ans.length ? Math.round(ans.filter(r => r.score >= 4).length / ans.length * 100) + '% gave 4 or 5' : ''],
    ['Follow-up', fu.length, fu.length ? 'low ratings not handled yet' : 'all handled'],
  ].map(([k, v, s]) => `<div class="tile"><div class="k">${k}</div><div class="v ${k === 'Follow-up' && fu.length ? 'low' : ''}">${v}</div><div class="s">${s}</div></div>`).join('');
  $('fu').innerHTML = fu.length ? `<table class="t"><thead><tr><th>Date</th><th>Stars</th><th>Location</th><th>Driver</th><th>Load</th><th>Comment</th><th></th></tr></thead><tbody>${fu.map(r => `
    <tr><td>${day(r.rated_at)}</td><td class="stars">${star(r.score)}</td><td>${esc(r.location)}<div class="mini">${esc(r.customer || '')}</div></td><td>${esc(r.driver || '')}</td>
      <td><a href="trip.html?load=${r.load_id}">${esc(r.load_no)}</a></td><td>${esc(r.comment || '')}<div class="mini">${esc(r.sent_to || '')}</div></td>
      <td>${canEdit() ? `<button class="btn small" data-h="${r.id}">Handled…</button>` : ''}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">Nothing to follow up. 👍</div>';
  document.querySelectorAll('[data-h]').forEach(b => b.onclick = async () => {
    const note = prompt('What was done? (goes on the record)'); if (note === null) return;
    const { error } = await sb.rpc('rating_handled', { p_id: b.dataset.h, p_note: note });
    if (error) return alert(error.message); load();
  });
  drawRoll();
  const cm = ans.filter(r => r.comment).slice(0, 60);
  $('comments').innerHTML = cm.length ? `<table class="t"><tbody>${cm.map(r => `<tr><td style="width:90px">${day(r.rated_at)}</td><td class="stars" style="width:90px">${star(r.score)}</td>
    <td>${esc(r.comment)}<div class="mini">${esc(r.location)} · ${esc(r.driver || '')} · load ${esc(r.load_no)}${r.handled_note ? ` · handled: ${esc(r.handled_note)}` : ''}</div></td></tr>`).join('')}</tbody></table>` : '<div class="empty">No comments in this period.</div>';
}

function group(rows, key, label) {
  const m = new Map();
  rows.forEach(r => { const k = r[key] || '—'; if (!m.has(k)) m.set(k, { key: k, label: r[label] || '(none)', rows: [] }); m.get(k).rows.push(r); });
  return [...m.values()].map(g => { const a = g.rows.filter(r => r.score); return { ...g, asked: g.rows.length, n: a.length, avg: a.length ? a.reduce((s, r) => s + r.score, 0) / a.length : null,
    dist: [1, 2, 3, 4, 5].map(k => a.filter(r => r.score === k).length), low: a.filter(r => r.score <= 2).length }; })
    .sort((x, y) => (y.n ? 1 : 0) - (x.n ? 1 : 0) || (x.avg ?? 9) - (y.avg ?? 9) || x.label.localeCompare(y.label));
}
function line(g, cls, attr) {
  const bar = g.n ? `<div class="dist" title="${g.dist.map((c, i) => `${i + 1}★: ${c}`).join(' · ')}">${g.dist.map((c, i) => c ? `<i style="width:${c / g.n * 100}%;background:${COL[i + 1]}"></i>` : '').join('')}</div>` : '';
  return `<tr class="${cls}" ${attr}><td>${esc(g.label)}</td><td>${g.n} of ${g.asked}</td><td class="avg">${g.avg ? g.avg.toFixed(2) + ' ★' : '—'}</td><td>${bar}</td><td class="${g.low ? 'low' : ''}">${g.low || ''}</td></tr>`;
}
function drawRoll() {
  const head = `<thead><tr><th>${{ driver: 'Driver', customer: 'Customer', location: 'Location' }[BY]}</th><th>Answered</th><th>Average</th><th>1 ★ → 5 ★</th><th>1–2 ★</th></tr></thead>`;
  let body = '';
  if (BY === 'customer') {
    for (const g of group(ROWS, 'main_customer_id', 'main_customer')) {
      const dcs = group(g.rows, 'customer_id', 'customer');
      body += line(g, dcs.length > 1 ? 'g' : '', `data-g="${g.key}"`);
      if (OPEN.has(g.key) && dcs.length > 1) dcs.forEach(d => body += line({ ...d, label: '↳ ' + d.label }, 'sub', ''));
    }
  } else body = group(ROWS, BY === 'driver' ? 'driver_id' : 'location_id', BY === 'driver' ? 'driver' : 'location').map(g => line(g, '', '')).join('');
  $('roll').innerHTML = ROWS.length ? `<table class="t">${head}<tbody>${body}</tbody></table>` : '<div class="empty">No ratings asked for in this period yet. They start with the next Delivered emails.</div>';
  document.querySelectorAll('#roll tr.g').forEach(tr => tr.onclick = () => { const k = tr.dataset.g; OPEN.has(k) ? OPEN.delete(k) : OPEN.add(k); drawRoll(); });
}

start();
</script>
</body>
</html>
