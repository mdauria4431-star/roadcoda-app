<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoadCoda · Account</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#1c1f24">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
  :root{--ground:#f4f2ee;--surface:#fff;--ink:#1c1f24;--muted:#5b5750;--line:#e2ddd3;--accent:#0f5e63;--late:#8f2318;--warn:#8a4b08;--ok:#1e6b34}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px}
  header{background:var(--ink);color:#fff;display:flex;align-items:center;gap:16px;padding:14px 24px;flex-wrap:wrap}
  header a{color:#d9d5cc}header a.on{color:#fff}
  .brand{font-family:Archivo,sans-serif;font-weight:800;font-size:22px}.brand span{color:#5fc2c7}
  .who{margin-left:auto;font-size:14px;color:#d9d5cc}
  button{font-family:inherit;cursor:pointer}
  .btn{height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600}
  .btn.primary{background:var(--accent);color:#fff;border:none}
  .btn.small{height:32px;padding:0 12px;font-size:13px}
  .btn.danger{color:var(--late)}
  .btn[disabled]{opacity:.5;cursor:default}
  main{max-width:1180px;margin:0 auto;padding:24px;display:flex;flex-direction:column;gap:16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
  .login{max-width:380px;margin:60px auto;display:flex;flex-direction:column;gap:12px}
  label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
  input,select,textarea{height:40px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:15px;font-family:inherit;color:var(--ink);background:#fff;min-width:0}
  textarea{height:64px;padding:8px 10px;resize:vertical}
  .error{color:var(--late);font-size:14px}.ok{color:var(--ok);font-size:14px}
  h1{font-family:Archivo,sans-serif;font-size:28px;margin:0}
  h2{font-family:Archivo,sans-serif;font-size:18px;margin:0}
  h3{font-size:13px;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .row{display:flex;gap:12px;align-items:end;flex-wrap:wrap}
  .hint{font-size:13px;color:var(--muted);line-height:1.5;margin:6px 0 0}
  .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .span2{grid-column:span 2}
  .tablewrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:900px}
  th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--line)}
  td{padding:10px 6px;border-bottom:1px solid #efebe4;vertical-align:top}
  #list tr{cursor:pointer}#list tr:hover{background:#faf8f4}
  tr.sel{background:#eef6f6!important}
  .mono{font-family:'IBM Plex Mono',monospace;font-size:13px}
  .pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
  .p-ok{background:#e3f1e6;color:var(--ok)}.p-bad{background:#fbe0db;color:var(--late)}.p-warn{background:#fdf0d9;color:var(--warn)}.p-none{background:#ecebe8;color:#45423d}
  .exp-bad{color:var(--late);font-weight:600}.exp-warn{color:var(--warn);font-weight:600}
  .loginbox{display:flex;flex-direction:column;gap:8px;background:#f7f5f0;border-radius:10px;padding:12px 14px}
  .count{font-size:14px;color:var(--muted)}
  .modal{position:fixed;inset:0;background:rgba(20,22,26,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
  .modal .box{background:#fff;border-radius:14px;padding:22px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
  .modal .qr{padding:10px;background:#fff;border:1px solid var(--line);border-radius:10px}
  .events{list-style:none;margin:6px 0 0;padding:0;font-size:13px}
  .events li{display:flex;gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid #efebe4;flex-wrap:wrap}
  .events li.flag{color:var(--warn);font-weight:600}
  .paytbl{min-width:640px}.paytbl td,.paytbl th{padding:7px 6px}
  .paytbl tr.def td{color:var(--muted)}
  .paytbl tr.old td{color:#8a857c;text-decoration:line-through}
  .addpay{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.6fr) minmax(0,.9fr) minmax(0,1.2fr) minmax(0,1.5fr) auto;gap:10px;align-items:end;margin-top:10px}
  details.types summary{cursor:pointer;font-family:Archivo,sans-serif;font-size:18px;font-weight:700}
  .types td input,.types td select{height:34px;font-size:14px}
  @media (max-width:900px){.addpay{grid-template-columns:1fr 1fr}}
  @media (max-width:900px){.grid{grid-template-columns:1fr 1fr}}
  @media (max-width:560px){main{padding:16px}.grid{grid-template-columns:1fr}.span2{grid-column:auto}}
</style>
</head>
<body>
<header>
  <div class="brand">Road<span>Coda</span></div>
  <nav style="display:flex;gap:14px;font-size:14px;flex-wrap:wrap"><a href="index.html">Home</a></nav>
</header>
<main>
  <section id="set-view" class="card login" hidden>
    <h2 id="set-title">Choose your password</h2>
    <div class="hint" id="set-who" style="margin:0"></div>
    <label for="pw1">New password (at least 8 characters)<input id="pw1" type="password" autocomplete="new-password"></label>
    <label for="pw2">Type it again<input id="pw2" type="password" autocomplete="new-password"></label>
    <button class="btn primary" id="set-btn" type="button">Save password</button>
    <div class="error" id="set-error"></div>
  </section>

  <section id="forgot-view" class="card login" hidden>
    <h2>Forgot your password?</h2>
    <p class="hint" style="margin:0">Enter your work email. If it has a RoadCoda office login, we'll email you a link to choose a new password.</p>
    <label for="f-email">Email<input id="f-email" type="email" autocomplete="username"></label>
    <button class="btn primary" id="forgot-btn" type="button">Email me a link</button>
    <div class="hint" id="forgot-msg" style="margin:0"></div>
    <a href="index.html" style="font-size:14px;color:#0f5e63">Back to sign in</a>
    <p class="hint" style="margin:0">Drivers: use your reset card in the driver app, or ask dispatch.</p>
  </section>

  <section id="me-view" class="card login" hidden style="max-width:460px">
    <h2>My account</h2>
    <div id="me-info" class="hint" style="margin:0"></div>
    <h3>Change password</h3>
    <label for="c1">New password (at least 8 characters)<input id="c1" type="password" autocomplete="new-password"></label>
    <label for="c2">Type it again<input id="c2" type="password" autocomplete="new-password"></label>
    <button class="btn primary" id="change-btn" type="button">Change password</button>
    <div class="hint" id="change-msg" style="margin:0"></div>
    <div class="row" style="margin-top:8px"><a class="btn" href="index.html" style="display:inline-flex;align-items:center;text-decoration:none">Go to RoadCoda</a><button class="btn" id="out-btn" type="button">Sign out</button></div>
  </section>
</main>

<script>
if (!window.RC_CONFIG || !/^(sb_publishable_|eyJ)/.test(RC_CONFIG.SUPABASE_KEY || '')) {
  document.body.innerHTML = '<div style="max-width:560px;margin:60px auto;padding:20px;background:#fff;border:1px solid #e2ddd3;border-radius:12px;font-family:system-ui;line-height:1.5">' +
    '<h2 style="margin-top:0">RoadCoda can\'t find its settings</h2>' +
    (window.RC_CONFIG ? '<p><b>config.js</b> still has the placeholder key. Open it and paste your Publishable key (Supabase &gt; Project Settings &gt; API Keys).</p>'
                      : '<p><b>config.js</b> was not found next to this page. Unzip the whole kit into a normal folder (right-click the zip &gt; <b>Extract All</b>), then open the page from that folder.</p>') +
    '</div>';
  throw new Error('RoadCoda settings missing');
}


const sb = supabase.createClient(RC_CONFIG.SUPABASE_URL, RC_CONFIG.SUPABASE_KEY);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const QS = new URLSearchParams(location.search);
const setHash = QS.get('t') === 'set' ? (QS.get('th') || '') : '', setEmail = QS.get('e') || '';
if (setHash) history.replaceState(null, '', location.pathname);   // keep the one-time code out of the address bar
const pwOk = (a, b, el) => {
  if (a.length < 8) { el.textContent = 'Use at least 8 characters.'; return false; }
  if (a !== b) { el.textContent = 'The two passwords don\'t match.'; return false; }
  return true;
};

async function start() {
  if (setHash) {
    $('set-view').hidden = false; $('set-who').textContent = setEmail ? `Your login: ${setEmail}` : ''; $('pw1').focus(); return;
  }
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('forgot-view').hidden = false; $('f-email').focus(); return; }
  const { data: p } = await sb.from('profiles').select('full_name, role, carriers(name)').eq('user_id', session.user.id).maybeSingle();
  if (p?.role === 'driver') { location.replace('driver.html'); return; }
  $('me-info').innerHTML = `${esc(p?.full_name || '')}<br>${esc(session.user.email)} · ${esc(p?.carriers?.name || '')} · ${esc(p?.role || '')}`;
  $('me-view').hidden = false;
}

$('set-btn').onclick = async () => {
  const a = $('pw1').value, b = $('pw2').value; $('set-error').textContent = '';
  if (!pwOk(a, b, $('set-error'))) return;
  $('set-btn').disabled = true;
  const { error: ve } = await sb.auth.verifyOtp({ token_hash: setHash, type: 'recovery' });
  if (ve) {
    $('set-btn').disabled = false;
    $('set-error').innerHTML = /expired|invalid/i.test(ve.message) ? 'This link has expired or was already used. <a href="account.html">Get a new one</a>.' : esc(ve.message);
    return;
  }
  const { error } = await sb.auth.updateUser({ password: a });
  $('set-btn').disabled = false;
  if (error) { $('set-error').textContent = error.message; return; }
  location.replace('index.html');
};
$('pw2').onkeydown = (e) => { if (e.key === 'Enter') $('set-btn').click(); };

$('forgot-btn').onclick = async () => {
  const email = $('f-email').value.trim();
  if (!email) { $('forgot-msg').textContent = 'Enter your email.'; return; }
  $('forgot-btn').disabled = true; $('forgot-msg').textContent = 'Sending…';
  const { data, error } = await sb.functions.invoke('office-users', { body: { action: 'forgot', email } });
  $('forgot-btn').disabled = false;
  $('forgot-msg').innerHTML = error ? '<span class="error">Something went wrong. Try again in a minute.</span>' : `<span class="ok">${esc(data?.message || 'Check your email.')}</span>`;
};
$('f-email').onkeydown = (e) => { if (e.key === 'Enter') $('forgot-btn').click(); };

$('change-btn').onclick = async () => {
  const a = $('c1').value, b = $('c2').value; $('change-msg').textContent = '';
  if (!pwOk(a, b, $('change-msg'))) return;
  $('change-btn').disabled = true;
  const { error } = await sb.auth.updateUser({ password: a });
  $('change-btn').disabled = false;
  $('change-msg').innerHTML = error ? `<span class="error">${esc(error.message)}</span>` : '<span class="ok">Password changed.</span>';
  if (!error) { $('c1').value = ''; $('c2').value = ''; }
};
$('out-btn').onclick = async () => { await sb.auth.signOut(); location.replace('index.html'); };

start();
</script>
</body>
</html>
