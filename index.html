<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoadCoda · Today</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#1c1f24">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
  :root{--ground:#f4f2ee;--surface:#fff;--ink:#1c1f24;--muted:#5b5750;--line:#e2ddd3;--accent:#0f5e63;--late:#8f2318;
        --ok-bg:#e3f1e6;--ok:#1e6b34;--info-bg:#e3edf6;--info:#1d4e89;--risk-bg:#fbeed8;--risk:#8a4b08}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px}
  header{background:var(--ink);color:#fff;display:flex;align-items:center;gap:16px;padding:14px 24px;flex-wrap:wrap}
  header a{color:#d9d5cc}header a.on{color:#fff}
  .brand{font-family:Archivo,sans-serif;font-weight:800;font-size:22px}.brand span{color:#5fc2c7}
  .who{margin-left:auto;font-size:14px;color:#d9d5cc}
  button{font-family:inherit;cursor:pointer}
  .btn{height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600}
  .btn.primary{background:var(--accent);color:#fff;border:none}
  .btn.danger{color:var(--late)}
  .btn.small{height:32px;padding:0 12px;font-size:13px}
  main{max-width:1280px;margin:0 auto;padding:24px;display:flex;flex-direction:column;gap:16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
  .login{max-width:380px;margin:60px auto;display:flex;flex-direction:column;gap:12px}
  label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
  input,select{height:40px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:15px;font-family:inherit;color:var(--ink);background:#fff;min-width:0}
  .error{color:var(--late);font-size:14px}
  .ok{color:var(--ok);font-size:14px}
  .toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap}
  h1{font-family:Archivo,sans-serif;font-size:28px;margin:0;flex-grow:1}
  h2{font-family:Archivo,sans-serif;font-size:18px;margin:0 0 12px}
  .tablewrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:720px}
  th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--line)}
  td{padding:10px 6px;border-bottom:1px solid #efebe4;vertical-align:top}
  tr.click{cursor:pointer}tr.click:hover{background:#faf8f4}
  .mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}.num{text-align:right}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .s-planned{background:var(--info-bg);color:var(--info)}.s-dispatched{background:var(--risk-bg);color:var(--risk)}
  .s-in_progress{background:var(--ok-bg);color:var(--ok)}.s-delivered{background:#ecebe8;color:#45423d}.s-cancelled{background:#fbe0db;color:var(--late)}
  .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .stop{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:2fr .8fr 2fr 1fr 1fr 1fr .8fr .9fr auto;gap:10px;align-items:end;margin-bottom:10px}
  .stop .n{font-family:Archivo,sans-serif;font-weight:800;align-self:center}
  #app{display:flex;flex-direction:column;gap:16px}
  .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .note{margin-top:10px;padding:10px 12px;background:#f7f5f0;border-radius:8px;font-size:13px;color:var(--muted);line-height:1.5}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.thumbs img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#eee}
  .s-hint{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:-4px}
  .s-hint.new{color:#8a4b08}
  .imp-tbl td,.imp-tbl th{font-size:13px;padding:6px 5px}
  .tag-new{background:#fbeed8;color:#8a4b08;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:600;white-space:nowrap}
  .tag-old{background:#e3f1e6;color:#1e6b34;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:600;white-space:nowrap}
  main a{color:var(--accent)}main a.btn.primary{color:#fff}main a.kpi{color:var(--ink)}
  .kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-decoration:none;color:var(--ink);display:block}
  .kpi b{display:block;font-family:Archivo,sans-serif;font-size:28px;margin-top:4px}
  .kpi span{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
  .kpi small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
  .kpi.warn b{color:var(--late)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .att{list-style:none;margin:0;padding:0}
  .att li{padding:9px 0;border-bottom:1px solid #efebe4;display:flex;gap:10px;align-items:baseline}
  .att li:last-child{border-bottom:none}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:var(--risk)}
  .dot.red{background:var(--late)}.dot.blue{background:var(--info)}
  .actions a.btn{display:inline-flex;align-items:center;text-decoration:none}
  .bar{height:8px;background:#ecebe8;border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--accent)}
  @media (max-width:1000px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.two{grid-template-columns:1fr}}
  @media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .detail-stop{padding:10px 0;border-bottom:1px solid #efebe4;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  @media (max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stop{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
  <div class="brand">Road<span>Coda</span></div>
  <nav style="display:flex;gap:14px;font-size:14px;flex-wrap:wrap"><a class="on" href="index.html">Home</a><a href="dispatch.html">Dispatch</a><a href="loads.html">Loads</a><a href="customers.html">Customers</a><a href="rates.html">Rates</a><a href="invoices.html">Invoices</a><a href="tolls.html">Tolls</a><a href="integrations.html">Integrations</a><a href="driver.html">Driver app</a></nav>
  <div class="who" id="who"></div>
  <button class="btn small" id="signout" hidden>Sign out</button>
</header>

<main>
  <section id="login-view" class="card login" hidden>
    <h2>Sign in</h2>
    <label for="email">Email<input id="email" type="email" autocomplete="username"></label>
    <label for="password">Password<input id="password" type="password" autocomplete="current-password"></label>
    <button class="btn primary" id="login-btn">Sign in</button>
    <div class="error" id="login-error"></div>
  </section>

  <div id="app" hidden style="display:flex;flex-direction:column;gap:16px">
    <div class="toolbar">
      <h1 id="title">Today</h1>
      <label for="day">Date<input id="day" type="date"></label>
      <button class="btn" id="refresh">Refresh</button>
    </div>
    <div class="actions" style="display:flex;gap:10px;flex-wrap:wrap">
      <a class="btn primary" href="loads.html?new=1">New load</a>
      <a class="btn" href="loads.html?import=1">Import delivery list</a>
      <a class="btn" href="dispatch.html">Dispatch board</a>
      <a class="btn" href="invoices.html">New weekly invoice</a>
    </div>

    <div class="kpis" id="kpis"></div>

    <div class="two">
      <section class="card"><h2>Needs attention</h2><ul class="att" id="attention"></ul></section>
      <section class="card"><h2>Drivers today</h2><div class="tablewrap"><table style="min-width:420px">
        <thead><tr><th>Driver</th><th>Truck</th><th>Stops</th><th>Now</th></tr></thead><tbody id="drivers"></tbody></table></div></section>
    </div>

    <div class="two">
      <section class="card"><h2>Latest activity</h2><ul class="att" id="activity"></ul></section>
      <section class="card"><h2>Tomorrow and billing</h2><ul class="att" id="ahead"></ul></section>
    </div>
  </div>
</main>

<script>
if (!window.RC_CONFIG || !/^(sb_publishable_|eyJ)/.test(RC_CONFIG.SUPABASE_KEY || '')) {
  document.body.innerHTML = '<div style="max-width:560px;margin:60px auto;padding:20px;background:#fff;border:1px solid #e2ddd3;border-radius:12px;font-family:system-ui;line-height:1.5">' +
    '<h2 style="margin-top:0">RoadCoda can\'t find its settings</h2>' +
    (window.RC_CONFIG ? '<p><b>config.js</b> still has the placeholder key. Open it and paste your Publishable key (Supabase &gt; Project Settings &gt; API Keys).</p>'
                      : '<p><b>config.js</b> was not found next to this page. Unzip the whole kit into a normal folder (right-click the zip &gt; <b>Extract All</b>), then open the page from that folder.</p>') +
    '</div>';
  throw new Error('RoadCoda settings missing');
}
const sb = supabase.createClient(RC_CONFIG.SUPABASE_URL, RC_CONFIG.SUPABASE_KEY);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (n) => '$' + Math.round(Number(n || 0)).toLocaleString();
const time = (t) => t ? new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '–';
const localISO = (d) => { d = new Date(d); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return localISO(d); };
const ISSUE = { damaged: 'OS&D · Damaged', short: 'OS&D · Short', over: 'OS&D · Over', refused: 'Refused', closed: 'Closed / no access', other: 'Delivery issue' };
const loadLink = (l, day) => `loads.html?load=${l.id}&day=${day}`;

async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('login-view').hidden = false; return; }
  const { data: p } = await sb.from('profiles').select('role, full_name, carriers(name)').eq('user_id', session.user.id).single();
  if (!p) { $('login-error').textContent = 'This login is not linked to a carrier.'; $('login-view').hidden = false; return; }
  if (p.role === 'driver') { location.replace('driver.html'); return; }   // drivers go straight to their app
  $('who').textContent = `${p.full_name || session.user.email} · ${p.carriers?.name || ''} · ${p.role}`;
  $('signout').hidden = false; $('login-view').hidden = true; $('app').hidden = false;
  $('day').value = localISO(new Date());
  load();
}
$('login-btn').onclick = async () => {
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
  if (error) { $('login-error').textContent = error.message; return; }
  start();
};
$('signout').onclick = async () => { await sb.auth.signOut(); location.reload(); };
$('day').onchange = () => load();
$('refresh').onclick = () => load();

async function load() {
  const day = $('day').value, tomorrow = addDays(day, 1), today = localISO(new Date());
  $('title').textContent = day === today ? 'Today' : new Date(day + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  const sel = 'id, load_no, status, miles, driver_id, customer_id, invoice_id, hub_required, hub_start, hub_end, drivers(full_name), equipment(unit_no), customers(name), ' +
              'stops(id, seq, stop_type, needs_review, added_note, consignee, address, status, window_start, window_end, eta, arrived_at, departed_at, issue_type, late_reason)';
  const [L, T, P, I] = await Promise.all([
    sb.from('loads').select(sel).eq('service_date', day).neq('status', 'cancelled').order('load_no'),
    sb.from('loads').select('id, load_no, driver_id, status, customers(name), stops(id)').eq('service_date', tomorrow).neq('status', 'cancelled'),
    sb.from('load_profit').select('billed, cost').eq('service_date', day),
    sb.from('invoices').select('id, invoice_no, status, due_date, total, customers(name)').in('status', ['draft', 'approved', 'sent'])
  ]);
  if (L.error) { $('kpis').innerHTML = `<div class="card error">${esc(L.error.message)}</div>`; return; }
  const loads = L.data || [], now = new Date();
  const stops = loads.flatMap(l => (l.stops || []).map(s => ({ ...s, load: l })));
  const done = stops.filter(s => ['delivered', 'exception'].includes(s.status));
  const late = stops.filter(s => !['delivered', 'exception'].includes(s.status) && s.window_end &&
    ((s.eta && new Date(s.eta) > new Date(s.window_end)) || (day === today && now > new Date(s.window_end) && !s.arrived_at)));
  const issues = stops.filter(s => s.status === 'exception');
  const miles = loads.reduce((a, l) => a + Number(l.miles || 0), 0);
  const billed = (P.data || []).reduce((a, r) => a + Number(r.billed), 0), cost = (P.data || []).reduce((a, r) => a + Number(r.cost), 0);
  const byStatus = (st) => loads.filter(l => l.status === st).length;

  $('kpis').innerHTML = `
    <a class="kpi" href="dispatch.html"><span>Loads</span><b>${loads.length}</b><small>${byStatus('in_progress')} rolling · ${byStatus('delivered')} delivered · ${byStatus('planned') + byStatus('dispatched')} to go</small></a>
    <a class="kpi" href="dispatch.html"><span>Stops done</span><b>${done.length}/${stops.length}</b><div class="bar"><i style="width:${stops.length ? Math.round(done.length / stops.length * 100) : 0}%"></i></div></a>
    <a class="kpi ${late.length ? 'warn' : ''}" href="dispatch.html"><span>Running late</span><b>${late.length}</b><small>stops past their window</small></a>
    <a class="kpi ${issues.length ? 'warn' : ''}" href="loads.html?day=${day}"><span>Delivery issues</span><b>${issues.length}</b><small>OS&amp;D, refused, closed</small></a>
    <div class="kpi"><span>Miles</span><b>${Math.round(miles).toLocaleString()}</b><small>planned / hub</small></div>
    <div class="kpi"><span>Revenue</span><b>${money(billed)}</b><small>${billed ? `margin ${money(billed - cost)} (${Math.round((billed - cost) / billed * 100)}%)` : 'per-load pricing only'}</small></div>`;

  // Needs attention
  const att = [];
  late.forEach(s => att.push(['red', `<a href="${loadLink(s.load, day)}">Load ${esc(s.load.load_no)}</a> · stop ${s.seq} ${esc(s.consignee)} running late (window ends ${time(s.window_end)})`]));
  issues.forEach(s => att.push(['red', `<a href="${loadLink(s.load, day)}">Load ${esc(s.load.load_no)}</a> · ${esc(ISSUE[s.issue_type] || 'Delivery issue')} at ${esc(s.consignee)}${s.late_reason ? ': ' + esc(s.late_reason) : ''}`]));
  stops.filter(s => s.needs_review).forEach(s => att.push(['', `<a href="${loadLink(s.load, day)}">Load ${esc(s.load.load_no)}</a> · driver added a stop: ${esc(s.consignee)}${s.added_note ? ' (' + esc(s.added_note) + ')' : ''}`]));
  loads.filter(l => !l.driver_id).forEach(l => att.push(['', `<a href="${loadLink(l, day)}">Load ${esc(l.load_no)}</a> · no driver assigned`]));
  loads.filter(l => l.hub_required && l.status === 'delivered' && l.hub_end == null).forEach(l => att.push(['', `<a href="${loadLink(l, day)}">Load ${esc(l.load_no)}</a> · delivered but the ending odometer is missing (hub miles)`]));
  const noAddr = stops.filter(s => !s.address && s.status === 'pending');
  if (noAddr.length) {
    const cid = noAddr[0].load?.customer_id;
    att.push(['', `${noAddr.length} open stop${noAddr.length === 1 ? '' : 's'} today ${noAddr.length === 1 ? 'has' : 'have'} no address (${esc([...new Set(noAddr.map(s => s.consignee))].slice(0, 3).join(', '))}${new Set(noAddr.map(s => s.consignee)).size > 3 ? '…' : ''}) · <a href="customers.html?filter=missing${cid ? '&customer=' + cid : ''}">Fix on Customers</a>`]);
  }
  $('attention').innerHTML = att.map(([c, t]) => `<li><span class="dot ${c}"></span><span>${t}</span></li>`).join('') || '<li><span class="dot blue"></span><span>Nothing needs attention right now.</span></li>';

  // Drivers
  const drivers = {};
  loads.forEach(l => { const k = l.driver_id || 'none'; (drivers[k] = drivers[k] || { name: l.drivers?.full_name || 'Unassigned', truck: l.equipment?.unit_no || '', loads: [] }).loads.push(l); });
  $('drivers').innerHTML = Object.values(drivers).map(d => {
    const st = d.loads.flatMap(l => l.stops || []), dn = st.filter(s => ['delivered', 'exception'].includes(s.status)).length;
    const cur = d.loads.flatMap(l => (l.stops || []).map(s => ({ ...s, l }))).sort((a, b) => a.seq - b.seq).find(s => !['delivered', 'exception'].includes(s.status));
    const nowTxt = !cur ? 'Finished' : cur.status === 'arrived' ? `At ${esc(cur.consignee)} since ${time(cur.arrived_at)}` : `Next: ${esc(cur.consignee)} (${time(cur.window_start)})`;
    return `<tr><td>${esc(d.name)}</td><td class="mono">${esc(d.truck)}</td><td class="mono">${dn}/${st.length}</td><td>${nowTxt}</td></tr>`;
  }).join('') || '<tr><td colspan="4">No loads on this date.</td></tr>';

  // Latest activity
  const ev = [];
  stops.forEach(s => {
    if (s.arrived_at) ev.push([s.arrived_at, `${esc(s.load.drivers?.full_name || 'Driver')} arrived at ${esc(s.consignee)}`, s.load]);
    if (s.departed_at) ev.push([s.departed_at, `${esc(s.load.drivers?.full_name || 'Driver')} ${s.status === 'exception' ? 'reported ' + esc(ISSUE[s.issue_type] || 'an issue') + ' at' : s.stop_type === 'pickup' ? 'picked up at' : 'delivered'} ${esc(s.consignee)}`, s.load]);
  });
  ev.sort((a, b) => new Date(b[0]) - new Date(a[0]));
  $('activity').innerHTML = ev.slice(0, 10).map(([t, txt, l]) => `<li><span class="mono" style="min-width:70px;color:var(--muted)">${time(t)}</span><span>${txt} · <a href="${loadLink(l, day)}">load ${esc(l.load_no)}</a></span></li>`).join('')
    || '<li><span>No driver activity yet on this date.</span></li>';

  // Tomorrow and billing
  const tl = T.data || [], inv = I.data || [];
  const drafts = inv.filter(i => i.status === 'draft'), open = inv.filter(i => i.status !== 'draft');
  const overdue = open.filter(i => i.due_date < today);
  const ahead = [
    ['blue', `<a href="loads.html?day=${tomorrow}">Tomorrow</a>: ${tl.length} load${tl.length === 1 ? '' : 's'}, ${tl.reduce((a, l) => a + (l.stops || []).length, 0)} stops${tl.filter(l => !l.driver_id).length ? ` · <b>${tl.filter(l => !l.driver_id).length} without a driver</b>` : ''}${tl.length ? '' : ' · <a href="loads.html?import=1">import a delivery list</a>'}`],
    [drafts.length ? '' : 'blue', `<a href="invoices.html">Draft invoices</a>: ${drafts.length}${drafts.length ? ` (${money(drafts.reduce((a, i) => a + Number(i.total), 0))}) to check and approve` : ''}`],
    ['blue', `Approved / sent, unpaid: ${open.length} (${money(open.reduce((a, i) => a + Number(i.total), 0))})`],
    [overdue.length ? 'red' : 'blue', `Past due: ${overdue.length}${overdue.length ? ` (${money(overdue.reduce((a, i) => a + Number(i.total), 0))}) · ${overdue.slice(0, 3).map(i => esc(i.customers?.name)).join(', ')}` : ''}`]
  ];
  $('ahead').innerHTML = ahead.map(([c, t]) => `<li><span class="dot ${c}"></span><span>${t}</span></li>`).join('');
}

start();
</script>
</body>
</html>
