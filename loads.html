<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoadCoda · Loads</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
  :root{--ground:#f4f2ee;--surface:#fff;--ink:#1c1f24;--muted:#5b5750;--line:#e2ddd3;--accent:#0f5e63;--late:#8f2318;
        --ok-bg:#e3f1e6;--ok:#1e6b34;--info-bg:#e3edf6;--info:#1d4e89;--risk-bg:#fbeed8;--risk:#8a4b08}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px}
  header{background:var(--ink);color:#fff;display:flex;align-items:center;gap:16px;padding:14px 24px;flex-wrap:wrap}
  header a{color:#d9d5cc}header a.on{color:#fff}
  .brand{font-family:Archivo,sans-serif;font-weight:800;font-size:22px}.brand span{color:#5fc2c7}
  .who{margin-left:auto;font-size:14px;color:#d9d5cc}
  button{font-family:inherit;cursor:pointer}
  .btn{height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600}
  .btn.primary{background:var(--accent);color:#fff;border:none}
  .btn.danger{color:var(--late)}
  .btn.small{height:32px;padding:0 12px;font-size:13px}
  main{max-width:1280px;margin:0 auto;padding:24px;display:flex;flex-direction:column;gap:16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
  .login{max-width:380px;margin:60px auto;display:flex;flex-direction:column;gap:12px}
  label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
  input,select{height:40px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:15px;font-family:inherit;color:var(--ink);background:#fff;min-width:0}
  .error{color:var(--late);font-size:14px}
  .ok{color:var(--ok);font-size:14px}
  .toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap}
  h1{font-family:Archivo,sans-serif;font-size:28px;margin:0;flex-grow:1}
  h2{font-family:Archivo,sans-serif;font-size:18px;margin:0 0 12px}
  .tablewrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:720px}
  th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--line)}
  td{padding:10px 6px;border-bottom:1px solid #efebe4;vertical-align:top}
  tr.click{cursor:pointer}tr.click:hover{background:#faf8f4}
  .mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}.num{text-align:right}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .s-planned{background:var(--info-bg);color:var(--info)}.s-dispatched{background:var(--risk-bg);color:var(--risk)}
  .s-in_progress{background:var(--ok-bg);color:var(--ok)}.s-delivered{background:#ecebe8;color:#45423d}.s-cancelled{background:#fbe0db;color:var(--late)}
  .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .stop{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:2fr 2fr 1fr 1fr 1fr 1fr 1fr auto;gap:10px;align-items:end;margin-bottom:10px}
  .stop .n{font-family:Archivo,sans-serif;font-weight:800;align-self:center}
  #app{display:flex;flex-direction:column;gap:16px}
  .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .note{margin-top:10px;padding:10px 12px;background:#f7f5f0;border-radius:8px;font-size:13px;color:var(--muted);line-height:1.5}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.thumbs img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#eee}
  .detail-stop{padding:10px 0;border-bottom:1px solid #efebe4;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  @media (max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stop{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
  <div class="brand">Road<span>Coda</span></div>
  <nav style="display:flex;gap:14px;font-size:14px"><a href="dispatch.html">Dispatch</a><a class="on" href="loads.html">Loads</a><a href="rates.html">Rates</a><a href="driver.html">Driver app</a></nav>
  <div class="who" id="who"></div>
  <button class="btn small" id="signout" hidden>Sign out</button>
</header>

<main>
  <section id="login-view" class="card login" hidden>
    <h2>Sign in</h2>
    <label for="email">Email<input id="email" type="email" autocomplete="username"></label>
    <label for="password">Password<input id="password" type="password" autocomplete="current-password"></label>
    <button class="btn primary" id="login-btn">Sign in</button>
    <div class="error" id="login-error"></div>
  </section>

  <div id="app" hidden>
    <div class="toolbar">
      <h1>Loads</h1>
      <label for="day">Service date<input id="day" type="date"></label>
      <button class="btn primary" id="new-btn">New load</button>
    </div>

    <!-- New load form -->
    <section class="card" id="form" hidden>
      <h2>New load</h2>
      <div class="grid">
        <label for="f-no">Load number<input id="f-no"></label>
        <label for="f-date">Service date<input id="f-date" type="date"></label>
        <label for="f-customer">Customer (bill to)<select id="f-customer"></select></label>
        <label for="f-miles">Miles<input id="f-miles" type="number" min="0" step="1"></label>
        <label for="f-driver">Driver<select id="f-driver"></select></label>
        <label for="f-truck">Truck<select id="f-truck"></select></label>
        <label for="f-linehaul">Linehaul $<input id="f-linehaul" type="number" min="0" step="0.01"></label>
        <label for="f-fsc">Fuel surcharge $<input id="f-fsc" type="number" min="0" step="0.01"></label>
      </div>
      <div class="grid" style="margin-top:12px;grid-template-columns:3fr 1fr 1fr">
        <label for="f-origin">Start address (yard or pickup)<input id="f-origin"></label>
        <label style="flex-direction:row;align-items:center;gap:8px;align-self:end;height:40px"><input id="f-round" type="checkbox" checked style="height:auto"> Return to start</label>
        <button class="btn" id="calc" type="button" style="align-self:end">Get miles &amp; price</button>
      </div>
      <div id="calc-note" class="note" hidden></div>
      <h2 style="margin-top:18px">Stops</h2>
      <div id="stops"></div>
      <div class="actions">
        <button class="btn" id="add-stop">Add stop</button>
        <span style="flex-grow:1"></span>
        <button class="btn" id="cancel-form">Cancel</button>
        <button class="btn primary" id="save">Save load</button>
      </div>
      <div id="form-msg" style="margin-top:10px"></div>
    </section>

    <!-- Load list -->
    <section class="card">
      <div class="tablewrap">
        <table>
          <thead><tr><th>Load</th><th>Customer</th><th>Driver · Truck</th><th class="num">Stops</th><th class="num">Miles</th><th class="num">Billed</th><th>Status</th></tr></thead>
          <tbody id="list"></tbody>
        </table>
      </div>
    </section>

    <!-- Load detail -->
    <section class="card" id="detail" hidden></section>
  </div>
</main>

<script>
if (!window.RC_CONFIG || !/^(sb_publishable_|eyJ)/.test(RC_CONFIG.SUPABASE_KEY || '')) {
  document.body.innerHTML = '<div style="max-width:560px;margin:60px auto;padding:20px;background:#fff;border:1px solid #e2ddd3;border-radius:12px;font-family:system-ui;line-height:1.5">' +
    '<h2 style="margin-top:0">RoadCoda can\'t find its settings</h2>' +
    (window.RC_CONFIG ? '<p><b>config.js</b> still has the placeholder key. Open it and paste your Publishable key (Supabase &gt; Project Settings &gt; API Keys).</p>'
                      : '<p><b>config.js</b> was not found next to this page. Unzip the whole kit into a normal folder (right-click the zip &gt; <b>Extract All</b>), then open the page from that folder.</p>') +
    '</div>';
  throw new Error('RoadCoda settings missing');
}
const sb = supabase.createClient(RC_CONFIG.SUPABASE_URL, RC_CONFIG.SUPABASE_KEY);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (n) => '$' + Number(n || 0).toLocaleString(undefined, {maximumFractionDigits: 0});
const time = (t) => t ? new Date(t).toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'}) : '–';
const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const UNITS = ['pallets', 'boxes', 'cages', 'parts', 'totes', 'other'];
// Scans and photos the driver took at a stop.
function scanInfo(s) {
  const codes = (s.scans || []).filter(c => c.barcode), photos = (s.scans || []).filter(c => c.photo_path);
  if (!codes.length && !photos.length) return '';
  const list = codes.length ? `<details style="margin-top:6px"><summary style="cursor:pointer;font-size:13px">Scanned ${codes.length} label${codes.length > 1 ? 's' : ''}</summary>
    <div class="mono" style="font-size:13px;color:var(--muted)">${codes.map(c => `${esc(c.barcode)} · ${time(c.scanned_at)}`).join('<br>')}</div></details>` : '';
  const pics = photos.length ? `<div class="thumbs">${photos.map(c => `<a target="_blank" rel="noopener" data-photo="${esc(c.photo_path)}"><img alt="Delivery photo ${time(c.scanned_at)}" data-photo="${esc(c.photo_path)}"></a>`).join('')}</div>` : '';
  return list + pics;
}
// Photos are private: ask for short-lived links (1 hour) to show them.
async function showPhotos() {
  const els = [...document.querySelectorAll('#detail [data-photo]')];
  const paths = [...new Set(els.map(e => e.dataset.photo))];
  if (!paths.length) return;
  const { data } = await sb.storage.from('scan-photos').createSignedUrls(paths, 3600);
  const url = Object.fromEntries((data || []).map(d => [d.path, d.signedUrl]));
  els.forEach(e => { if (!url[e.dataset.photo]) return; if (e.tagName === 'IMG') e.src = url[e.dataset.photo]; else e.href = url[e.dataset.photo]; });
}
// Delivery issues reported by the driver. OS&D = over, short & damaged.
const ISSUE = { damaged: 'OS&D · Damaged', short: 'OS&D · Short', over: 'OS&D · Over', refused: 'Refused', closed: 'Closed / no access', other: 'Delivery issue' };
const issueLabel = (s) => ISSUE[s.issue_type] || 'Delivery issue';
// Red tag on the load; the driver's note shows on hover.
function problemPill(stops) {
  const p = (stops || []).filter(s => s.status === 'exception');
  if (!p.length) return '';
  const why = p.map(s => issueLabel(s) + (s.late_reason ? ': ' + s.late_reason : '')).join('; ');
  const text = p.length === 1 ? issueLabel(p[0]) : `${p.length} delivery issues`;
  return ` <span class="pill s-cancelled" title="${esc(why)}">${esc(text)}</span>`;
}
// Splits the load's billed total across stops (evenly), then across each stop's items by quantity.
// Used when Billed $ is left blank, so profit per stop and per unit always has a number.
function allocate(total, stops) {
  const cents = Math.round(total * 100), n = stops.length;
  return stops.map((s, i) => {
    const stopCents = Math.floor(cents / n) + (i === n - 1 ? cents - Math.floor(cents / n) * n : 0);
    const q = s.items.reduce((a, it) => a + (it.qty || 0), 0) || s.items.length;
    let used = 0;
    return s.items.map((it, j) => {
      const c = j === s.items.length - 1 ? stopCents - used : Math.round(stopCents * ((it.qty || (q === s.items.length ? 1 : 0)) / q));
      used += c; return c / 100;
    });
  });
}
const STATUS_LABEL = {planned:'Planned', dispatched:'Dispatched', in_progress:'In progress', delivered:'Delivered', cancelled:'Cancelled'};
let lists = {customers: [], drivers: [], equipment: []};
let yard = '';
let priced = null;   // what the last 'Get miles & price' returned

async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('login-view').hidden = false; return; }
  const { data: p } = await sb.from('profiles').select('role, full_name, carriers(name, yard_address)').eq('user_id', session.user.id).single();
  if (!p) { $('login-error').textContent = 'This login is not linked to a carrier.'; $('login-view').hidden = false; return; }
  if (p.role === 'driver') { location.href = 'driver.html'; return; }
  $('who').textContent = `${p.full_name || session.user.email} · ${p.carriers?.name || ''} · ${p.role}`;
  $('signout').hidden = false; $('login-view').hidden = true; $('app').hidden = false;
  yard = p.carriers?.yard_address || '';
  $('day').value = todayISO();
  await loadLists();
  loadList();
}
$('login-btn').onclick = async () => {
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
  if (error) { $('login-error').textContent = error.message; return; }
  start();
};
$('signout').onclick = async () => { await sb.auth.signOut(); location.reload(); };
$('day').onchange = () => { $('detail').hidden = true; loadList(); };

async function loadLists() {
  const [c, d, e] = await Promise.all([
    sb.from('customers').select('id, name').order('name'),
    sb.from('drivers').select('id, full_name').eq('active', true).order('full_name'),
    sb.from('equipment').select('id, unit_no').eq('active', true).order('unit_no')
  ]);
  lists = { customers: c.data || [], drivers: d.data || [], equipment: e.data || [] };
  const opts = (rows, label) => '<option value="">Choose…</option>' + rows.map(r => `<option value="${r.id}">${esc(r[label])}</option>`).join('');
  $('f-customer').innerHTML = opts(lists.customers, 'name');
  $('f-driver').innerHTML = opts(lists.drivers, 'full_name');
  $('f-truck').innerHTML = opts(lists.equipment, 'unit_no');
}

async function loadList() {
  const { data, error } = await sb.from('loads')
    .select('id, load_no, status, miles, customers(name), drivers(full_name), equipment(unit_no), stops(id, status, late_reason, issue_type), load_billing(linehaul, fuel_surcharge)')
    .eq('service_date', $('day').value).order('load_no');
  if (error) { $('list').innerHTML = `<tr><td colspan="7" class="error">${esc(error.message)}</td></tr>`; return; }
  $('list').innerHTML = data.map(l => {
    const b = Array.isArray(l.load_billing) ? l.load_billing[0] : l.load_billing;
    const billed = b ? Number(b.linehaul) + Number(b.fuel_surcharge) : 0;
    return `<tr class="click" data-id="${l.id}">
      <td class="mono">${esc(l.load_no)}</td><td>${esc(l.customers?.name)}</td>
      <td>${esc(l.drivers?.full_name || 'Unassigned')} · ${esc(l.equipment?.unit_no || '–')}</td>
      <td class="num mono">${l.stops.length}</td><td class="num mono">${Math.round(l.miles)}</td>
      <td class="num mono">${money(billed)}</td>
      <td><span class="pill s-${l.status}">${STATUS_LABEL[l.status] || l.status}</span>${problemPill(l.stops)}</td></tr>`;
  }).join('') || '<tr><td colspan="7">No loads on this date. Use New load to add one.</td></tr>';
  document.querySelectorAll('tr[data-id]').forEach(tr => tr.onclick = () => showDetail(tr.dataset.id));
}

// ---------- New load form ----------
function stopRow(n) {
  const div = document.createElement('div');
  div.className = 'stop';
  div.innerHTML = `
    <div class="n">Stop ${n}</div>
    <label>Consignee<input class="s-consignee" placeholder="e.g. XYZ Retail - Elm St. store"></label>
    <label>Address<input class="s-address"></label>
    <label>Window opens<input class="s-start" type="time" value="08:00"></label>
    <label>Window closes<input class="s-end" type="time" value="09:00"></label>
    <label>Unit<select class="s-unit">${UNITS.map(u => `<option>${u}</option>`).join('')}</select></label>
    <label>Quantity<input class="s-qty" type="number" min="0" step="1"></label>
    <label>Billed $<input class="s-billed" type="number" min="0" step="0.01" placeholder="Auto"></label>
    <button class="btn small danger s-remove" type="button" aria-label="Remove stop ${n}">Remove</button>`;
  div.querySelector('.s-remove').onclick = () => { div.remove(); renumber(); };
  return div;
}
function renumber() { document.querySelectorAll('#stops .stop .n').forEach((el, i) => el.textContent = `Stop ${i + 1}`); }
$('add-stop').onclick = () => { $('stops').appendChild(stopRow($('stops').children.length + 1)); };

$('new-btn').onclick = async () => {
  $('form').hidden = false; $('detail').hidden = true; $('form-msg').innerHTML = '';
  $('f-date').value = $('day').value;
  ['f-customer','f-driver','f-truck','f-miles','f-linehaul','f-fsc'].forEach(id => $(id).value = '');
  $('f-origin').value = yard; $('f-round').checked = true; $('calc-note').hidden = true; priced = null;
  $('stops').innerHTML = ''; $('stops').appendChild(stopRow(1));
  // Suggest the next load number
  const { data } = await sb.from('loads').select('load_no').order('created_at', { ascending: false }).limit(50);
  const nums = (data || []).map(r => parseInt(r.load_no, 10)).filter(n => !isNaN(n));
  $('f-no').value = nums.length ? String(Math.max(...nums) + 1) : '1001';
  $('f-no').focus();
};
$('cancel-form').onclick = () => { $('form').hidden = true; };

// ---------- Miles (Google, through the route-miles server function) and price (rate sheet) ----------
async function getMiles(origin, roundTrip, stopAddresses) {
  if (!origin) throw new Error('Enter a start address (set your yard address on the Rates page).');
  if (stopAddresses.some(a => !a)) throw new Error('Every stop needs an address to work out miles.');
  const addresses = [origin, ...stopAddresses, ...(roundTrip ? [origin] : [])];
  const { data, error } = await sb.functions.invoke('route-miles', { body: { addresses } });
  if (error) {
    let m = error.message;
    try { m = (await error.context.json()).error || m; } catch (_) {}
    throw new Error('Miles: ' + m);
  }
  return data;   // { miles, legs, drive_minutes }
}
// items: [{unit, qty}] across all stops; stopCount: number of stops
async function getPrice(customerId, date, miles, stopCount, items) {
  const units = {};
  items.forEach(s => { if (s.qty) units[s.unit] = (units[s.unit] || 0) + s.qty; });
  const { data, error } = await sb.rpc('price_load', { p_customer_id: customerId, p_date: date, p_miles: miles, p_stops: stopCount, p_units: units });
  if (error) throw new Error('Price: ' + error.message);
  return data;   // { linehaul, fuel_surcharge, note, customer_rate_id, fsc_rule_id, doe_price, doe_week }
}
function formStops() {
  return [...document.querySelectorAll('#stops .stop')].map(el => ({
    address: el.querySelector('.s-address').value.trim(),
    unit: el.querySelector('.s-unit').value,
    qty: parseInt(el.querySelector('.s-qty').value || '0', 10)
  }));
}
$('calc').onclick = async () => {
  const note = $('calc-note'); note.hidden = false; note.textContent = 'Working…';
  if (!$('f-customer').value) { note.innerHTML = '<span class="error">Choose the customer first.</span>'; return; }
  const stops = formStops(); const lines = [];
  priced = { miles_source: 'manual' };
  $('calc').disabled = true;
  try {
    try {
      const r = await getMiles($('f-origin').value.trim(), $('f-round').checked, stops.map(s => s.address));
      $('f-miles').value = Math.round(r.miles);
      priced.miles_source = 'google';
      lines.push(`Miles from Google (${r.mode === 'truck' ? 'truck route' : 'car route'}): ${r.miles} (${r.legs.join(' + ')}) · about ${Math.floor(r.drive_minutes / 60)} h ${r.drive_minutes % 60} min driving`);
      if (r.warning) lines.push(`<span class="error">${esc(r.warning)}</span>`);
    } catch (e) {
      lines.push(`<span class="error">${esc(e.message)}</span> Using the miles typed in.`);
    }
    const p = await getPrice($('f-customer').value, $('f-date').value, parseFloat($('f-miles').value || '0'), stops.length, stops);
    if (p.linehaul != null) $('f-linehaul').value = p.linehaul;
    if (p.fuel_surcharge != null) $('f-fsc').value = p.fuel_surcharge;
    Object.assign(priced, p);
    lines.push(esc(p.note));
    if (p.linehaul != null || p.fuel_surcharge != null) lines.push('You can still change the numbers before saving.');
  } catch (e) {
    lines.push(`<span class="error">${esc(e.message)}</span>`);
  } finally {
    $('calc').disabled = false;
    note.innerHTML = lines.join('<br>');
  }
};

$('save').onclick = async () => {
  const msg = (t, cls = 'error') => $('form-msg').innerHTML = `<span class="${cls}">${esc(t)}</span>`;
  const date = $('f-date').value;
  const stops = [...document.querySelectorAll('#stops .stop')].map((el, i) => ({
    seq: i + 1,
    consignee: el.querySelector('.s-consignee').value.trim(),
    address: el.querySelector('.s-address').value.trim() || null,
    start: el.querySelector('.s-start').value, end: el.querySelector('.s-end').value,
    unit: el.querySelector('.s-unit').value,
    qty: parseInt(el.querySelector('.s-qty').value || '0', 10),
    billed: parseFloat(el.querySelector('.s-billed').value || '0')
  }));
  if (!$('f-no').value.trim()) return msg('Enter a load number.');
  if (!date) return msg('Choose a service date.');
  if (!$('f-customer').value) return msg('Choose the customer.');
  if (!stops.length) return msg('Add at least one stop.');
  if (stops.some(s => !s.consignee)) return msg('Every stop needs a consignee.');
  if (stops.some(s => s.end <= s.start)) return msg('Each window must close after it opens.');
  if (stops.some(s => !(s.qty > 0))) return msg('Every stop needs a quantity above 0.');

  $('save').disabled = true; msg('Saving…', 'ok');
  const toTs = (t) => new Date(`${date}T${t}`).toISOString();
  let loadId = null;
  try {
    const { data: load, error: e1 } = await sb.from('loads').insert({
      load_no: $('f-no').value.trim(), service_date: date,
      customer_id: $('f-customer').value, driver_id: $('f-driver').value || null,
      truck_id: $('f-truck').value || null, miles: parseFloat($('f-miles').value || '0'),
      status: $('f-driver').value ? 'dispatched' : 'planned',
      origin_address: $('f-origin').value.trim() || null, round_trip: $('f-round').checked,
      miles_source: priced?.miles_source || 'manual'
    }).select('id').single();
    if (e1) throw e1;
    loadId = load.id;

    const { error: e2 } = await sb.from('load_billing').insert({
      load_id: loadId, linehaul: parseFloat($('f-linehaul').value || '0'), fuel_surcharge: parseFloat($('f-fsc').value || '0'),
      customer_rate_id: priced?.customer_rate_id || null, fsc_rule_id: priced?.fsc_rule_id || null,
      doe_price: priced?.doe_price ?? null, doe_week: priced?.doe_week || null, pricing_note: priced?.note || null
    });
    if (e2) throw e2;

    const { data: stopRows, error: e3 } = await sb.from('stops').insert(stops.map(s => ({
      load_id: loadId, seq: s.seq, consignee: s.consignee, address: s.address,
      window_start: toTs(s.start), window_end: toTs(s.end), eta: toTs(s.start)
    }))).select('id, seq');
    if (e3) throw e3;

    const bySeq = Object.fromEntries(stopRows.map(r => [r.seq, r.id]));
    if (stops.every(s => !s.billed)) {
      const total = parseFloat($('f-linehaul').value || '0') + parseFloat($('f-fsc').value || '0');
      const split = allocate(total, stops.map(s => ({ items: [{ qty: s.qty }] })));
      stops.forEach((s, i) => s.billed = split[i][0]);
    }
    const { error: e4 } = await sb.from('stop_items').insert(stops.map(s => ({
      stop_id: bySeq[s.seq], unit_type: s.unit, qty_ordered: s.qty, billed_amount: s.billed
    })));
    if (e4) throw e4;

    $('form').hidden = true;
    $('day').value = date;
    await loadList();
    showDetail(loadId);
  } catch (err) {
    if (loadId) await sb.from('loads').delete().eq('id', loadId);   // undo a half-saved load
    msg(err.message?.includes('duplicate') ? 'That load number is already used.' : (err.message || String(err)));
  } finally {
    $('save').disabled = false;
  }
};

// ---------- Load detail ----------
async function showDetail(id) {
  const { data: l, error } = await sb.from('loads')
    .select('id, load_no, status, service_date, miles, origin_address, round_trip, miles_source, customer_id, customers(name), drivers(full_name), equipment(unit_no), load_billing(linehaul, fuel_surcharge, pricing_note), stops(id, seq, consignee, address, window_start, window_end, arrived_at, departed_at, status, late_reason, issue_type, stop_items(id, unit_type, qty_ordered, qty_delivered, billed_amount), scans(id, barcode, photo_path, scanned_at))')
    .eq('id', id).single();
  if (error) { $('detail').hidden = false; $('detail').innerHTML = `<p class="error">${esc(error.message)}</p>`; return; }
  const b = Array.isArray(l.load_billing) ? l.load_billing[0] : l.load_billing;
  const stops = l.stops.sort((a, b) => a.seq - b.seq).map(s => {
    const items = s.stop_items.map(i => `${i.qty_delivered != null ? `Delivered ${i.qty_delivered} of ${i.qty_ordered}` : `${i.qty_ordered} ordered`} ${esc(i.unit_type)} · billed ${Number(i.billed_amount) ? '$' + Number(i.billed_amount).toFixed(2) : '–'}`).join('<br>');
    return `<div class="detail-stop">
      <div><strong>Stop ${s.seq} · ${esc(s.consignee)}</strong><br><span style="color:var(--muted)">${esc(s.address || '')}</span><br>${items}${scanInfo(s)}</div>
      <div class="mono" style="text-align:right">Window ${time(s.window_start)}–${time(s.window_end)}<br>
        Arrived ${time(s.arrived_at)} · Departed ${time(s.departed_at)}<br>
        <span class="pill s-${s.status === 'pending' ? 'planned' : s.status === 'arrived' ? 'in_progress' : s.status === 'exception' ? 'cancelled' : 'delivered'}">${s.status === 'exception' ? esc(issueLabel(s)) : ({pending: 'Pending', arrived: 'Arrived', delivered: 'Delivered'}[s.status] || esc(s.status))}</span>
        ${s.late_reason ? `<br><span class="error">${esc(s.late_reason)}</span>` : ''}</div></div>`;
  }).join('');
  $('detail').hidden = false;
  $('detail').innerHTML = `
    <div class="toolbar"><h2 style="flex-grow:1;margin:0">Load ${esc(l.load_no)} · ${esc(l.customers?.name)}</h2>
      <span class="pill s-${l.status}">${STATUS_LABEL[l.status]}</span>${problemPill(l.stops)}</div>
    <p>${esc(l.drivers?.full_name || 'No driver')} · ${esc(l.equipment?.unit_no || 'No truck')} · ${Math.round(l.miles)} miles ·
       Linehaul ${money(b?.linehaul)} + fuel ${money(b?.fuel_surcharge)}</p>
    <p style="color:var(--muted);font-size:13px;margin-top:-6px">Start: ${esc(l.origin_address || yard || 'not set')}${l.round_trip ? ' (round trip)' : ''} · miles ${l.miles_source === 'google' ? 'from Google' : 'typed in'}</p>
    ${b?.pricing_note ? `<div class="note">${esc(b.pricing_note)}</div>` : ''}
    ${stops}
    <div class="actions" style="margin-top:12px">
      ${l.status === 'planned' ? '<button class="btn primary" id="d-dispatch">Mark dispatched</button>' : ''}
      ${l.status !== 'cancelled' ? '<button class="btn" id="d-recalc">Recalculate miles &amp; price</button>' : ''}
      ${['planned','dispatched'].includes(l.status) ? '<button class="btn danger" id="d-cancel">Cancel load</button>' : ''}
    </div>
    <div id="d-msg" class="note" hidden></div>`;
  const setStatus = async (st) => { await sb.from('loads').update({ status: st }).eq('id', id); await loadList(); showDetail(id); };
  if ($('d-dispatch')) $('d-dispatch').onclick = () => setStatus('dispatched');
  if ($('d-cancel')) $('d-cancel').onclick = () => setStatus('cancelled');
  if ($('d-recalc')) $('d-recalc').onclick = async () => {
    const m = $('d-msg'); m.hidden = false; m.textContent = 'Working…'; $('d-recalc').disabled = true;
    try {
      const sorted = l.stops.slice().sort((a, b) => a.seq - b.seq);
      const origin = l.origin_address || yard;
      const r = await getMiles(origin, l.round_trip, sorted.map(s => s.address || ''));
      const items = sorted.flatMap(s => s.stop_items.map(i => ({ unit: i.unit_type, qty: Number(i.qty_ordered) || 0 })));
      const p2 = await getPrice(l.customer_id, l.service_date, Math.round(r.miles), sorted.length, items);
      const e1 = (await sb.from('loads').update({ miles: Math.round(r.miles), miles_source: 'google', origin_address: origin }).eq('id', id)).error;
      if (e1) throw e1;
      const upd = { pricing_note: p2.note, customer_rate_id: p2.customer_rate_id, fsc_rule_id: p2.fsc_rule_id, doe_price: p2.doe_price, doe_week: p2.doe_week };
      if (p2.linehaul != null) upd.linehaul = p2.linehaul;
      if (p2.fuel_surcharge != null) upd.fuel_surcharge = p2.fuel_surcharge;
      const e2 = (await sb.from('load_billing').update(upd).eq('load_id', id)).error;
      if (e2) throw e2;
      const total = Number(upd.linehaul ?? b?.linehaul ?? 0) + Number(upd.fuel_surcharge ?? b?.fuel_surcharge ?? 0);
      const split = allocate(total, sorted.map(s => ({ items: s.stop_items.map(i => ({ qty: Number(i.qty_ordered) || 0 })) })));
      for (const [si, s] of sorted.entries()) for (const [ii, it] of s.stop_items.entries()) {
        const e3 = (await sb.from('stop_items').update({ billed_amount: split[si][ii] }).eq('id', it.id)).error;
        if (e3) throw e3;
      }
      await loadList(); showDetail(id);
    } catch (e) { m.innerHTML = `<span class="error">${esc(e.message || String(e))}</span>`; $('d-recalc').disabled = false; }
  };
  showPhotos();
  $('detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

start();
</script>
