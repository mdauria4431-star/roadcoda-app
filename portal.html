<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deliveries</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js" integrity="sha384-xPW3QHswsICVC2mW6BFNwMbhpLkbZ133fKOhxNx3QGGgAOJfL3O9t8r2aWn1aez6" crossorigin="anonymous"></script>
<script src="config.js"></script>
<script src="rc-update.js" defer></script>
<style>
  :root{--brand:#0f5e63;--ink:#1c1f24;--muted:#5b6470;--line:#e2e5ea;--bg:#f5f6f8;--card:#fff;--ok:#1d7a46;--bad:#b3261e;--warn:#9a5b00}
  *{box-sizing:border-box} [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px}
  button{font-family:inherit;cursor:pointer}
  a{color:var(--brand)}
  .top{background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .top img{height:38px;max-width:180px;object-fit:contain}
  .top .co{font-family:Archivo,sans-serif;font-weight:800;font-size:19px}
  .top .who{margin-left:auto;font-size:13.5px;color:var(--muted);text-align:right}
  .wrap{max-width:1180px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .btn{height:38px;padding:0 16px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
  .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  .login{max-width:400px;margin:60px auto;padding:26px;display:flex;flex-direction:column;gap:14px}
  label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13px}
  input,select{height:40px;border:1px solid var(--line);border-radius:9px;padding:0 11px;font-family:inherit;font-size:15px}
  .tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .tabs button{height:38px;padding:0 16px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .sigrow{grid-column:1/-1;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:8px;margin-top:4px}
  .sigimg{max-height:70px;max-width:240px;background:#fff;border:1px solid var(--line);border-radius:6px}
  .bar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
  .sp{flex:1}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);background:#fafbfc;white-space:nowrap}
  td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  tr.r{cursor:pointer} tr.r:hover{background:#f7f9fb}
  .n{font-family:'IBM Plex Mono',monospace;font-size:13.5px;white-space:nowrap}
  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:#eef1f4;color:var(--muted);white-space:nowrap}
  .pill.ok{background:#e4f4ea;color:var(--ok)} .pill.bad{background:#fdecea;color:var(--bad)} .pill.go{background:#e6f0f8;color:#1d5b8f}
  .empty{padding:28px;text-align:center;color:var(--muted)}
  .err{color:var(--bad)}
  .hint{font-size:13px;color:var(--muted)}
  .detail{margin-top:16px}
  .detail h2{font-family:Archivo,sans-serif;margin:0;font-size:19px}
  .stop{padding:14px 16px;border-top:1px solid var(--line);display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:12px}
  @media (max-width:760px){.stop{grid-template-columns:1fr}}
  .stop b{display:block}
  .k{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:2px}
  .pods{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .pods img{width:110px;height:110px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
  .inv{padding:26px;max-width:860px;margin:0 auto}
  .inv h1{font-family:Archivo,sans-serif;margin:0 0 4px}
  .inv table td,.inv table th{padding:8px 10px}
  .num{text-align:right}
  @media print{ .top,.tabs,.bar,.noprint,#list-card{display:none!important} body{background:#fff} .card{border:0} .wrap{padding:0} }

  @media (prefers-color-scheme: dark){
    :root{--ink:#e8edf2;--muted:#a3adb8;--line:#2b3642;--bg:#0f1419;--card:#182029;--ok:#5fd08c;--bad:#ff8a7d;--warn:#f0b35a;color-scheme:dark}
    .btn,.tabs button,input,select,textarea{background:#10161d;color:var(--ink)}
    .btn.primary,.tabs button.on{background:var(--brand);color:#fff}
    th{background:#141b23} tr.r:hover{background:#1c2530}
    .pill{background:#232a31;color:#b9c2cc} .pill.ok{background:#15301f} .pill.bad{background:#3a1d19} .pill.go{background:#16283b;color:#8fc3f5}
  }
  @media print{ :root{--ink:#1c1f24;--muted:#5b6470;--line:#e2e5ea;--bg:#fff;--card:#fff} }
</style>
</head>
<body>
<div class="top" id="top" hidden>
  <img id="logo" alt="" hidden><span class="co" id="co"></span>
  <div class="who"><span id="who"></span><br><a href="#" id="out">Sign out</a> · <a href="privacy.html">Privacy</a></div>
</div>

<section class="card login" id="login" hidden>
  <div class="co" style="font-family:Archivo,sans-serif;font-size:22px;font-weight:800">Your deliveries</div>
  <div class="hint">Sign in with the email your carrier set up for you.</div>
  <label>Email<input id="email" type="email" autocomplete="username"></label>
  <label>Password<input id="pw" type="password" autocomplete="current-password"></label>
  <button class="btn primary" id="in">Sign in</button>
  <a href="#" id="forgot" class="hint">Forgot your password?</a>
  <div id="login-msg" class="hint"></div>
</section>

<div class="wrap" id="app" hidden>
  <div class="tabs" id="tabs"></div>
  <div class="card" id="list-card">
    <div class="bar" id="bar"></div>
    <div id="list"><div class="empty">Loading…</div></div>
  </div>
  <div id="detail" class="detail"></div>
</div>

<script>
if (!window.RC_CONFIG) throw new Error('RoadCoda settings missing');
const sb = supabase.createClient(RC_CONFIG.SUPABASE_URL, RC_CONFIG.SUPABASE_KEY);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso = (d) => { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 10); };
const day = (d) => d ? new Date(d + 'T12:00:00').toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }) : '';
const hm = (t) => t ? new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '—';
const money = (n) => n == null ? '' : '$' + Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const qty = (n) => n == null ? '—' : Number(n).toLocaleString();
const ISSUE = { damaged: 'Damaged', short: 'Short', over: 'Over', refused: 'Refused', closed: 'Closed / no access', other: 'Issue' };
const STATUS = (s) => ({ delivered: '<span class="pill ok">Delivered</span>', exception: '<span class="pill bad">Delivered with issue</span>', in_progress: '<span class="pill go">On the way</span>',
  arrived: '<span class="pill go">At the dock</span>', dispatched: '<span class="pill">Scheduled</span>', planned: '<span class="pill">Scheduled</span>', pending: '<span class="pill">Scheduled</span>' }[s] || `<span class="pill">${esc(s)}</span>`);
let ME = null, TAB = 'loads', BOXES = [];

async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('login').hidden = false; return; }
  const { data, error } = await sb.rpc('portal_me');
  if (error || !data) {
    // an office or driver login landed here: send it where it belongs
    const { data: p } = await sb.from('profiles').select('role').eq('user_id', session.user.id).maybeSingle();
    if (p) { location.replace(p.role === 'driver' ? 'driver.html' : 'index.html'); return; }
    $('login').hidden = false; $('login-msg').innerHTML = '<span class="err">This login isn\'t set up for the delivery portal. Ask your carrier.</span>'; return;
  }
  ME = data;
  if (/^#[0-9a-f]{6}$/i.test(ME.brand_color || '')) document.documentElement.style.setProperty('--brand', ME.brand_color);
  $('co').textContent = ME.carrier; document.title = `Deliveries · ${ME.carrier}`;
  if (ME.logo_path) { const u = sb.storage.from('brand-logos').getPublicUrl(ME.logo_path).data.publicUrl; $('logo').src = u; $('logo').hidden = false; $('logo').onerror = () => $('logo').hidden = true; }
  $('who').innerHTML = `${esc(ME.name)} · <b>${esc(ME.kind === 'billing' ? ME.customer : (ME.locations || []).map(l => l.name).join(', '))}</b>${ME.carrier_phone ? ` · questions? ${esc(ME.carrier_phone)}` : ''}`;
  $('top').hidden = false; $('app').hidden = false;
  // Which tabs: the carrier's choice for this customer, less any the customer's portal admin switched off (72).
  // Before 72 there's no ME.tabs, so everything shows as it used to.
  const allowed = Array.isArray(ME.tabs) ? ME.tabs : ['loads', 'invoices', 'file', 'boxes'];
  const NAMES = { loads: ME.kind === 'billing' ? 'Loads' : 'Deliveries', invoices: 'Invoices', file: 'Activity file', boxes: 'Containers' };
  const tabs = ['loads', 'invoices', 'file'].filter(k => allowed.includes(k) && (ME.kind === 'billing' || k === 'loads')).map(k => [k, NAMES[k]]);
  // Returnable containers (cages, totes…): the tab shows only when their stores are holding some
  if (allowed.includes('boxes')) { const bx = await sb.rpc('portal_containers'); BOXES = bx.error ? [] : (bx.data || []); }
  if (BOXES.length) tabs.push(['boxes', 'Containers']);
  if (ME.is_admin) tabs.push(['team', 'Team']);
  if (!tabs.length) { $('list').innerHTML = `<div class="empty">Nothing is switched on for your login yet. Ask ${esc(ME.carrier)}${ME.carrier_phone ? ' (' + esc(ME.carrier_phone) + ')' : ''} or your company's portal admin.</div>`; return; }
  $('tabs').innerHTML = tabs.map(([k, t]) => `<button data-t="${k}">${t}</button>`).join('');
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => go(b.dataset.t));
  const want = new URLSearchParams(location.search).get('tab');
  go(tabs.some(t => t[0] === want) ? want : tabs[0][0]);
}
$('in').onclick = async () => {
  $('login-msg').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pw').value });
  if (error) { $('login-msg').innerHTML = `<span class="err">${esc(error.message)}</span>`; return; }
  location.reload();
};
$('pw').onkeydown = (e) => { if (e.key === 'Enter') $('in').click(); };
$('forgot').onclick = async (e) => {
  e.preventDefault();
  const email = $('email').value.trim(); if (!email) { $('login-msg').textContent = 'Type your email above first.'; return; }
  const { data } = await sb.functions.invoke('portal-users', { body: { action: 'forgot', email } });
  $('login-msg').textContent = data?.message || 'If that email has a login, a reset link is on its way.';
};
$('out').onclick = async (e) => { e.preventDefault(); await sb.auth.signOut(); location.reload(); };

function go(t) {
  TAB = t; $('detail').innerHTML = '';
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  history.replaceState(null, '', '?tab=' + t);
  if (t === 'invoices') return invoices();
  if (t === 'file') return fileTab();
  if (t === 'boxes') return boxesTab();
  if (t === 'team') return teamTab();
  loadsTab();
}

// ── Team (the customer's portal admin): switch tabs off for their own people (72) ──
async function teamTab() {
  $('bar').innerHTML = `<span class="hint">Choose what each of your people sees. You can switch off anything ${esc(ME.carrier)} has turned on for your company; to add something, ask ${esc(ME.carrier)}.</span>`;
  const { data, error } = await sb.rpc('portal_team');
  if (error) { $('list').innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }
  const allowed = ME.allowed || [], N = { loads: 'Loads / deliveries', invoices: 'Invoices', file: 'Activity file', boxes: 'Containers' };
  const cols = ['loads', 'invoices', 'file', 'boxes'].filter(k => allowed.includes(k));
  $('list').innerHTML = (data || []).length ? `<table><thead><tr><th>Name</th><th>Email</th>${cols.map(k => `<th>${N[k]}</th>`).join('')}<th>Last seen</th></tr></thead><tbody>${data.map(p => `<tr${p.active ? '' : ' style="opacity:.5"'}>
      <td><b>${esc(p.full_name)}</b>${p.is_admin ? ' <span class="pill">admin</span>' : ''}${p.kind === 'delivery' ? ' <span class="hint">store login</span>' : ''}</td><td>${esc(p.email)}</td>
      ${cols.map(k => { const na = p.kind === 'delivery' && !['loads', 'boxes'].includes(k);
        return `<td>${na ? '<span class="hint">—</span>' : `<input type="checkbox" data-u="${p.user_id}" data-k="${k}" ${(p.hidden_tabs || []).includes(k) ? '' : 'checked'} aria-label="${N[k]} for ${esc(p.full_name)}">`}</td>`; }).join('')}
      <td class="hint">${p.last_seen_at ? new Date(p.last_seen_at).toLocaleDateString() : 'never'}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">No one yet.</div>';
  document.querySelectorAll('#list input[data-u]').forEach(c => c.onchange = async () => {
    const hidden = [...document.querySelectorAll(`#list input[data-u="${c.dataset.u}"]`)].filter(x => !x.checked).map(x => x.dataset.k);
    const { error: e } = await sb.rpc('portal_set_hidden', { p_user: c.dataset.u, p_hidden: hidden });
    if (e) { alert(e.message); c.checked = !c.checked; return; }
    if (c.dataset.u === ME.user_id) location.reload();
  });
}

// ── Loads / deliveries ────────────────────────────────────────────────
function loadsTab() {
  const to = new Date(); to.setDate(to.getDate() + 2); const from = new Date(); from.setDate(from.getDate() - 13);
  $('bar').innerHTML = `<label>From<input type="date" id="f"></label><label>To<input type="date" id="t"></label><span class="sp"></span>
    <span class="hint">${ME.kind === 'billing' ? 'Every load for ' + esc(ME.customer) + ((ME.accounts || []).length > 1 ? ' and its DCs' : '') : 'Deliveries to your location' + ((ME.locations || []).length > 1 ? 's' : '')}. Click one for times, counts and proof of delivery.</span>`;
  $('f').value = iso(from); $('t').value = iso(to);
  $('f').onchange = $('t').onchange = loadList;
  loadList();
}
async function loadList() {
  $('list').innerHTML = '<div class="empty">Loading…</div>';
  const { data, error } = await sb.rpc('portal_list', { p_from: $('f').value, p_to: $('t').value });
  if (error) { $('list').innerHTML = `<div class="empty err">${esc(error.message)}</div>`; return; }
  const all = data || [];
  // Route # (auto-parts accounts): a column and a filter, only when routes are in use
  const routes = [...new Set(all.map(r => r.route_no).filter(Boolean))].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  const hasRt = routes.length > 0;
  if (hasRt && !$('rt')) { const l = document.createElement('label'); l.innerHTML = 'Route<select id="rt"><option value="">All</option></select>'; $('t').parentNode.after(l); $('rt').onchange = loadList; }
  if ($('rt')) { const keep = $('rt').value; $('rt').innerHTML = '<option value="">All</option>' + routes.map(r => `<option ${r === keep ? 'selected' : ''}>${esc(r)}</option>`).join(''); }
  const pick = $('rt') ? $('rt').value : '';
  const rows = pick ? all.filter(r => r.route_no === pick) : all;
  if (!rows.length) { $('list').innerHTML = '<div class="empty">Nothing in these dates.</div>'; return; }
  const multi = (ME.accounts || []).length > 1;
  const rtH = hasRt ? '<th>Route</th>' : '', rtC = (r) => hasRt ? `<td class="n">${esc(r.route_no || '')}</td>` : '';
  $('list').innerHTML = ME.kind === 'billing'
    ? `<table><thead><tr><th>Date</th><th>Load</th>${multi ? '<th>DC</th>' : ''}${rtH}<th>Status</th><th>Stops</th><th>Delivered</th><th>Issues</th><th>POD</th><th>Invoice</th></tr></thead><tbody>${rows.map(r => `
        <tr class="r" data-l="${r.load_id}"><td>${day(r.service_date)}</td><td class="n">${esc(r.load_no)}</td>${multi ? `<td>${esc(r.account)}</td>` : ''}${rtC(r)}<td>${STATUS(r.status)}</td>
          <td class="n">${r.stops_done}/${r.stops}</td><td class="n">${qty(r.delivered)} of ${qty(r.ordered)}</td>
          <td>${r.issue ? `<span class="pill bad">${esc(r.issue.split(', ').map(x => ISSUE[x] || x).join(', '))}</span>` : ''}</td><td>${r.pod ? '✓' : ''}</td>
          <td class="n">${esc(r.invoice_no || '')}${r.billed != null ? `<div class="hint">${money(r.billed)}</div>` : ''}</td></tr>`).join('')}</tbody></table>`
    : `<table><thead><tr><th>Date</th><th>Location</th>${rtH}<th>Load</th><th>Window</th><th>Arrived</th><th>Departed</th><th>Delivered</th><th>Issue</th><th>POD</th></tr></thead><tbody>${rows.map(r => `
        <tr class="r" data-l="${r.load_id}"><td>${day(r.service_date)}</td><td>${esc(r.location)}</td>${rtC(r)}<td class="n">${esc(r.load_no)}</td>
          <td class="n">${hm(r.window_start)}–${hm(r.window_end)}</td><td class="n">${r.arrived_at ? hm(r.arrived_at) : r.eta ? `<span class="hint">ETA ${hm(r.eta)}</span>` : '—'}</td><td class="n">${hm(r.departed_at)}</td>
          <td class="n">${qty(r.delivered)} of ${qty(r.ordered)}</td><td>${r.issue ? `<span class="pill bad">${esc(ISSUE[r.issue] || r.issue)}</span>` : ''}</td><td>${r.pod ? '✓' : ''}</td></tr>`).join('')}</tbody></table>`;
  document.querySelectorAll('tr[data-l]').forEach(tr => tr.onclick = () => showLoad(tr.dataset.l));
}
let TRACK_ON = null;   // 87
async function showLoad(id) {
  const { data: l, error } = await sb.rpc('portal_load', { p_load: id });
  if (error) { $('detail').innerHTML = `<div class="card empty err">${esc(error.message)}</div>`; return; }
  const paths = l.stops.flatMap(s => s.photos || []);
  const urls = {};
  if (paths.length) { try { const r = await sb.storage.from('scan-photos').createSignedUrls(paths, 3600); (Array.isArray(r.data) ? r.data : []).forEach(x => { if (x.signedUrl) urls[x.path] = x.signedUrl; }); } catch (_) { /* shown without photos */ } }
  // Signed POD (76): who signed, when, BOL #, the signature, what they noted — nothing before 76
  const sg = await sb.rpc('portal_signatures', { p_load: id });
  const SIG = Object.fromEntries((sg.error ? [] : sg.data || []).map(x => [x.stop_id, x]));
  LAST = { l, urls, SIG };
  // Documents the carrier shared (79): BOLs, lumper / scale receipts…
  const dq = await sb.rpc('portal_documents', { p_load: id }), DOCS = dq.error ? [] : (dq.data || []);
  const durls = {};
  if (DOCS.length) { try { const r = await sb.storage.from('scan-photos').createSignedUrls(DOCS.map(d => d.path), 3600); (Array.isArray(r.data) ? r.data : []).forEach(x => { if (x.signedUrl) durls[x.path] = x.signedUrl; }); } catch (_) { /* listed without links */ } }
  const DOCN = { bol: 'BOL', fuel_receipt: 'Fuel receipt', lumper: 'Lumper receipt', scale: 'Scale ticket', toll: 'Toll receipt', trip_sheet: 'Trip sheet', other: 'Document' };
  const seqOf = Object.fromEntries(l.stops.map(x => [x.id, x.seq]));
  // Live tracking (87): a Track button on stops still to come, when the carrier has the add-on
  if (TRACK_ON === null) { try { const r = await sb.rpc('portal_tracking_on'); TRACK_ON = !r.error && r.data === true; } catch (_) { TRACK_ON = false; } }
  const canTrack = (s) => TRACK_ON && l.status === 'in_progress' && s.status === 'pending';
  $('detail').innerHTML = `<div class="card"><div class="bar"><h2>Load ${esc(l.load_no)} · ${day(l.service_date)}</h2>${STATUS(l.status)}${ME.kind === 'billing' && (ME.accounts || []).length > 1 ? `<span class="hint">${esc(l.account)}</span>` : ''}<span class="sp"></span><button class="btn noprint" onclick="window.print()">Print</button></div>
    ${l.stops.map(s => `<div class="stop">
      <div><div class="k">${s.type === 'pickup' ? 'Pickup' : 'Stop ' + s.seq}</div><b>${esc(s.name)}</b><div class="hint">${esc(s.address || '')}</div>
        ${canTrack(s) ? `<button class="btn noprint" data-track="${s.id}" style="margin-top:6px">Track this ${s.type === 'pickup' ? 'pickup' : 'delivery'}</button>` : ''}
        ${s.issue ? `<div style="margin-top:6px"><span class="pill bad">${esc(ISSUE[s.issue] || s.issue)}</span>${s.issue_resolution ? ` <span class="hint">${esc(s.issue_resolution)}</span>` : ''}</div>` : ''}
        ${(s.delays || []).length ? `<div class="hint" style="margin-top:6px">Delay: ${s.delays.map(d => `${esc(d.code || '')} ${esc(d.reason || '')} · ${d.minutes} min`).join('; ')}</div>` : ''}</div>
      <div><div class="k">Times</div>Window ${hm(s.window_start)}–${hm(s.window_end)}<br>Arrived <b style="display:inline">${hm(s.arrived_at)}</b>${!s.arrived_at && s.eta ? ` <span class="hint">(ETA ${hm(s.eta)})</span>` : ''}<br>Departed <b style="display:inline">${hm(s.departed_at)}</b></div>
      <div><div class="k">Counts</div>${(s.items || []).map(i => `${esc(i.unit)}: <b style="display:inline">${qty(i.delivered)}</b> of ${qty(i.ordered)}`).join('<br>') || '—'}
        ${(s.photos || []).length ? `<div class="pods">${s.photos.map(p => urls[p] ? `<a href="${urls[p]}" target="_blank" rel="noopener"><img src="${urls[p]}" alt="Proof of delivery"></a>` : '').join('')}</div>` : ''}</div>
      ${s.type !== 'pickup' ? `<div class="sigrow">${sigHtml(SIG[s.id])}${['delivered', 'exception'].includes(s.status) ? `<button class="btn noprint" data-receipt="${s.id}">Delivery receipt</button>` : ''}</div>` : ''}
    </div>`).join('')}
    ${DOCS.length ? `<div class="stop" style="display:block"><div class="k">Documents</div>${DOCS.map(d => `<div style="padding:3px 0">${durls[d.path] ? `<a href="${durls[d.path]}" target="_blank" rel="noopener">${DOCN[d.kind] || 'Document'}</a>` : (DOCN[d.kind] || 'Document')}${d.stop_id && seqOf[d.stop_id] ? ` · stop ${seqOf[d.stop_id]}` : ''}${d.note ? ` <span class="hint">${esc(d.note)}</span>` : ''}</div>`).join('')}</div>` : ''}</div>`;
  document.querySelectorAll('[data-receipt]').forEach(b => b.onclick = () => receipt(b.dataset.receipt));
  document.querySelectorAll('[data-track]').forEach(b => b.onclick = async () => {
    const w = window.open('', '_blank');                      // open now, so a phone doesn't block it as a pop-up
    const { data, error } = await sb.rpc('portal_track_link', { p_stop: b.dataset.track });
    if (error || !data) { if (w) w.close(); alert(error ? error.message : 'Tracking isn\'t available for this stop now.'); return; }
    const url = new URL('track.html?t=' + encodeURIComponent(data), location.href).href;
    if (w) w.location = url; else location.href = url;
  });
  $('detail').scrollIntoView({ behavior: 'smooth' });
}

// ── Signed POD (76) ────────────────────────────────────────────────────
let LAST = null;
const bolLabel = (b) => (/^bol/i.test(b) ? '' : 'BOL ') + esc(b);
const sigImg = (g) => g && /^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(g.signature || '') ? `<img class="sigimg" src="${g.signature}" alt="Receiver's signature">` : '';
const when = (t) => t ? new Date(t).toLocaleString([], { month: 'numeric', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
function sigHtml(g) {
  if (!g) return '<div class="hint">No signature on file.</div>';
  if (g.refused) return `<div><div class="k">Proof of delivery</div>Not signed — ${esc(g.refused_reason || '')}${g.bol_no ? ` · ${bolLabel(g.bol_no)}` : ''}</div>`;
  return `<div><div class="k">Received by</div><b style="display:inline">${esc(g.receiver_name || '')}</b> · ${when(g.signed_at)}${g.bol_no ? ` · ${bolLabel(g.bol_no)}` : ''}
    ${g.receiver_notes ? `<div style="color:#b3261e;margin-top:4px"><b style="display:inline">Noted at delivery:</b> ${esc(g.receiver_notes)}</div>` : ''}</div>${sigImg(g)}`;
}
// One printable page per stop — for accounts payable, or to save as PDF
function receipt(stopId) {
  const { l, urls, SIG } = LAST, s = l.stops.find(x => x.id === stopId), g = SIG[stopId];
  const w = window.open('', '_blank'); if (!w) return alert('Allow pop-ups for this site to open the receipt.');
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Delivery receipt — Load ${esc(l.load_no)} stop ${s.seq}</title>
    <style>body{font-family:Arial,sans-serif;color:#111;max-width:7.5in;margin:24px auto;padding:0 16px}h1{font-size:20px;margin:0}.sub{color:#555;margin:2px 0 16px}
      table{border-collapse:collapse;width:100%;margin:10px 0}td,th{border:1px solid #bbb;padding:6px 8px;text-align:left;font-size:13px}th{background:#f2f2f2}
      .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#666}.sig{border:1px solid #bbb;max-width:320px;background:#fff}.note{color:#b3261e}
      .pods img{max-width:220px;margin:6px 6px 0 0;border:1px solid #ccc}@media print{button{display:none}}</style></head><body>
    <button onclick="print()" style="float:right;padding:6px 12px">Print / Save as PDF</button>
    <h1>Delivery receipt</h1><div class="sub">${esc(ME.carrier || '')} · Load ${esc(l.load_no)} · ${day(l.service_date)}</div>
    <div class="k">Delivered to</div><b>${esc(s.name)}</b><div>${esc(s.address || '')}</div>
    <table><tr><th>Arrived</th><th>Departed</th><th>Status</th></tr><tr><td>${when(s.arrived_at)}</td><td>${when(s.departed_at)}</td><td>${s.issue ? esc(ISSUE[s.issue] || s.issue) : 'Delivered'}</td></tr></table>
    <table><tr><th>Item</th><th>Ordered</th><th>Delivered</th></tr>${(s.items || []).map(i => `<tr><td>${esc(i.unit)}</td><td>${qty(i.ordered)}</td><td>${qty(i.delivered)}</td></tr>`).join('')}</table>
    ${g ? (g.refused ? `<p><b>Not signed:</b> ${esc(g.refused_reason || '')}</p>` : `<div class="k">Received by</div><b>${esc(g.receiver_name || '')}</b> · ${when(g.signed_at)}${g.bol_no ? ` · ${bolLabel(g.bol_no)}` : ''}<br>${sigImg(g).replace('class="sigimg"', 'class="sig"')}`) + (g.receiver_notes ? `<p class="note"><b>Noted at delivery:</b> ${esc(g.receiver_notes)}</p>` : '') : '<p>No signature on file.</p>'}
    ${(s.photos || []).length ? `<div class="k" style="margin-top:12px">Photos</div><div class="pods">${s.photos.map(p => urls[p] ? `<img src="${urls[p]}" alt="Proof of delivery photo">` : '').join('')}</div>` : ''}
    </body></html>`);
  w.document.close();
}

// ── Containers held at your stores ────────────────────────────────────
function boxesTab() {
  $('bar').innerHTML = `<span class="hint">Returnable containers (cages, totes…) delivered to ${ME.kind === 'billing' ? 'your stores' : 'your location'} and not picked up yet, oldest first.
    Red = held longer than ${esc(ME.carrier)} expects. Please have them ready for the driver.</span>`;
  const byLoc = new Map();
  BOXES.forEach(b => { if (!byLoc.has(b.location_id)) byLoc.set(b.location_id, { name: b.location, code: b.location_code, route: b.route_no, rows: [] }); byLoc.get(b.location_id).rows.push(b); });
  const locs = [...byLoc.values()].sort((a, b) => Math.max(...b.rows.map(x => x.days)) - Math.max(...a.rows.map(x => x.days)));
  const types = [...new Set(BOXES.map(b => b.type))].sort();
  $('list').innerHTML = `<table><thead><tr><th>Store</th>${locs.some(l => l.route) ? '<th>Route</th>' : ''}${types.map(t => `<th class="num">${esc(t)}</th>`).join('')}<th class="num">Oldest</th></tr></thead><tbody>${locs.map((l, i) => {
      const old = Math.max(...l.rows.map(x => x.days)), late = l.rows.some(x => x.overdue);
      return `<tr class="r" data-bx="${i}"><td><b>${esc(l.name)}</b>${l.code ? ` <span class="hint">#${esc(l.code)}</span>` : ''}</td>${locs.some(x => x.route) ? `<td class="n">${esc(l.route || '')}</td>` : ''}
        ${types.map(t => `<td class="n num">${l.rows.filter(x => x.type === t).length || ''}</td>`).join('')}<td class="n num">${late ? `<span class="pill bad">${Math.floor(old)} days</span>` : Math.floor(old) + ' days'}</td></tr>`; }).join('')}</tbody></table>`;
  document.querySelectorAll('tr[data-bx]').forEach(tr => tr.onclick = () => {
    const l = locs[+tr.dataset.bx];
    $('detail').innerHTML = `<div class="card"><div class="bar"><h2>${esc(l.name)}</h2><span class="sp"></span><button class="btn noprint" onclick="window.print()">Print</button></div>
      <table><thead><tr><th>Barcode</th><th>Type</th><th>Delivered</th><th class="num">Days</th><th>Load</th></tr></thead><tbody>${l.rows.map(x => `<tr><td class="n">${esc(x.barcode)}</td><td>${esc(x.type)}</td>
        <td>${day(x.since)}</td><td class="n num">${x.overdue ? `<span class="pill bad">${Math.floor(x.days)}</span>` : Math.floor(x.days)}</td><td class="n">${esc(x.load_no || '')}</td></tr>`).join('')}</tbody></table></div>`;
    $('detail').scrollIntoView({ behavior: 'smooth' });
  });
}

// ── Invoices (billing logins) ────────────────────────────────────────
async function invoices() {
  $('bar').innerHTML = '<span class="hint">Invoices from ' + esc(ME.carrier) + '. Click one to view or print it.</span>';
  const { data, error } = await sb.rpc('portal_invoices');
  if (error) { $('list').innerHTML = `<div class="empty err">${esc(error.message)}</div>`; return; }
  const rows = data || [];
  const multi = (ME.accounts || []).length > 1;
  $('list').innerHTML = rows.length ? `<table><thead><tr><th>Invoice</th><th>Date</th>${multi ? '<th>DC</th>' : ''}<th>Period</th><th>Due</th><th class="num">Amount</th><th>Status</th></tr></thead><tbody>${rows.map(r => `
      <tr class="r" data-i="${r.id}"><td class="n">${esc(r.invoice_no)}</td><td>${day(r.invoice_date)}</td>${multi ? `<td>${esc(r.account)}</td>` : ''}<td>${r.period_from ? day(r.period_from) + ' – ' + day(r.period_to) : ''}</td>
        <td>${day(r.due_date)}</td><td class="n num">${money(r.total)}</td><td>${r.status === 'paid' ? '<span class="pill ok">Paid</span>' : new Date(r.due_date) < new Date() ? '<span class="pill bad">Past due</span>' : '<span class="pill">Open</span>'}</td></tr>`).join('')}</tbody></table>`
    : '<div class="empty">No invoices yet.</div>';
  document.querySelectorAll('tr[data-i]').forEach(tr => tr.onclick = () => showInvoice(tr.dataset.i));
}
async function showInvoice(id) {
  const { data: v, error } = await sb.rpc('portal_invoice', { p_invoice: id });
  if (error) { $('detail').innerHTML = `<div class="card empty err">${esc(error.message)}</div>`; return; }
  $('detail').innerHTML = `<div class="card"><div class="inv">
    <div style="display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap">
      <div><h1>Invoice ${esc(v.invoice_no)}</h1><div class="hint">Dated ${day(v.invoice_date)} · due ${day(v.due_date)}${v.period_from ? ` · period ${day(v.period_from)} – ${day(v.period_to)}` : ''}${v.po_number ? ` · PO ${esc(v.po_number)}` : ''}</div></div>
      <button class="btn noprint" onclick="window.print()">Print / save as PDF</button></div>
    <div style="display:flex;gap:40px;margin:18px 0;flex-wrap:wrap">
      <div><div class="k">From</div><b>${esc(v.from.name)}</b><div class="hint" style="white-space:pre-line">${esc(v.from.address || '')}${v.from.phone ? '\n' + esc(v.from.phone) : ''}</div></div>
      <div><div class="k">Bill to</div><b>${esc(v.bill_to.name)}</b><div class="hint" style="white-space:pre-line">${esc(v.bill_to.address || '')}</div></div></div>
    <table><thead><tr><th>Description</th><th class="num">Rate</th><th>Basis</th><th class="num">Qty</th><th class="num">Amount</th></tr></thead><tbody>${(v.lines || []).map(l => `
      <tr><td>${esc(l.description)}${l.load_no ? ` <span class="hint">· load ${esc(l.load_no)}</span>` : ''}</td><td class="n num">${l.rate != null ? money(l.rate) : ''}</td><td>${esc(l.basis || '')}</td><td class="n num">${l.volume ?? ''}</td><td class="n num">${money(l.amount)}</td></tr>`).join('')}
      <tr><td colspan="4" class="num"><b>Total</b></td><td class="n num"><b>${money(v.total)}</b></td></tr></tbody></table>
    ${(v.lines || []).filter(l => l.backup && l.backup.loads).map(l => `<h3 style="margin:22px 0 6px">Toll reconciliation — ${esc(new Date(l.backup.month + 'T12:00:00').toLocaleDateString([], { month: 'long', year: 'numeric' }))}</h3>
      <div class="hint" style="margin-bottom:6px">Tolls were billed at an estimate on each load's invoice; this compares them with the actual toll statement.</div>
      <table><thead><tr><th>Load</th><th>Date</th><th>Invoice</th><th class="num">Invoiced</th><th class="num">Actual</th><th class="num">Difference</th></tr></thead><tbody>${l.backup.loads.map(r => `
        <tr><td class="n">${esc(r.load_no)}</td><td>${day(r.date)}</td><td class="n">${esc(r.invoice_no)}</td><td class="n num">${money(r.invoiced)}</td><td class="n num">${money(r.actual)}</td><td class="n num">${money(r.difference)}</td></tr>`).join('')}
        <tr><td colspan="5" class="num"><b>Reconciliation</b></td><td class="n num"><b>${money(l.amount)}</b></td></tr></tbody></table>`).join('')}
    ${v.notes ? `<p class="hint">${esc(v.notes)}</p>` : ''}
    <p class="hint">${v.status === 'paid' ? 'Paid — thank you.' : 'Questions about this invoice? Contact ' + esc(v.from.name) + (v.from.phone ? ' at ' + esc(v.from.phone) : '') + '.'}</p>
  </div></div>`;
  $('detail').scrollIntoView({ behavior: 'smooth' });
}

// ── Activity file (billing logins) ───────────────────────────────────
function fileTab() {
  const to = new Date(); to.setDate(to.getDate() - to.getDay() - 1); const from = new Date(to); from.setDate(from.getDate() - 6);
  $('bar').innerHTML = `<label>From<input type="date" id="f"></label><label>To<input type="date" id="t"></label><button class="btn primary" id="dl">Download</button><span class="sp"></span>
    <span class="hint">Every stop on every delivered load, in the layout agreed with ${esc(ME.carrier)}.</span>`;
  $('f').value = iso(from); $('t').value = iso(to);
  $('list').innerHTML = '<div class="empty">Pick the dates and download. Last week is filled in.</div>';
  $('dl').onclick = async () => {
    const { data, error } = await sb.rpc('portal_activity_csv', { p_from: $('f').value, p_to: $('t').value });
    if (error) { $('list').innerHTML = `<div class="empty err">${esc(error.message)}</div>`; return; }
    const f = (data || [])[0]; if (!f) return;
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([f.csv], { type: 'text/csv' })); a.download = f.file_name; document.body.appendChild(a); a.click(); a.remove();
    $('list').innerHTML = `<div class="empty">Downloaded ${esc(f.file_name)} — ${f.rows_count} lines.</div>`;
  };
}

start();
</script>
</body>
</html>
