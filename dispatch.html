<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatch · RoadCoda</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px}
  button{font-family:inherit;cursor:pointer}
  .btn{height:32px;padding:0 13px;border-radius:8px;border:1px solid var(--line);font-weight:600;display:inline-flex;align-items:center;text-decoration:none}
  main{padding:14px 16px 28px!important}
  .login{max-width:380px;margin:60px auto;display:flex;flex-direction:column;gap:12px}
  label{display:flex;flex-direction:column;gap:5px;font-weight:600}
  input{height:34px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-family:inherit;color:var(--ink)}

  /* One compact toolbar instead of a title block and four KPI cards —
     every pixel of height goes to rows. */
  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;background:none!important}
  .bar h1{margin:0;font-size:19px}
  .bar .cnt{display:flex;gap:12px;font-size:12.5px;color:var(--muted)}
  .bar .cnt b{font-family:var(--mono);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
  .bar .cnt .red b{color:var(--late)}
  .bar .sp{flex:1}
  .bar input[type=date]{height:32px;font-family:var(--mono);font-size:12.5px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .boardwrap{overflow-x:auto}
  table.board{width:100%;border-collapse:collapse;font-size:13px;min-width:1020px}
  .board thead th{position:sticky;top:0;z-index:2;font-family:var(--ui);font-size:10.5px;font-weight:600;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-3);text-align:left;padding:7px 9px;background:var(--panel-2);border-bottom:1px solid var(--line);white-space:nowrap}
  .board tbody tr{height:28px;border-bottom:1px solid var(--line-soft);cursor:pointer}
  .board tbody tr:hover{background:color-mix(in srgb,var(--accent) 9%,transparent)}
  .board tbody tr:focus-visible{outline:2px solid var(--accent-hi);outline-offset:-2px}
  .board td{padding:0 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:235px;border-bottom:0}
  .board tr.grp{cursor:default;height:23px}
  .board tr.grp:hover{background:none}
  .board tr.grp td{background:var(--panel-2);border-bottom:1px solid var(--line);font-family:var(--ui);font-size:9.5px;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
  .board tr.grp.red td{color:var(--late)}
  .board tr.grp.amber td{color:var(--warn)}
  .board tr.grp .gnote{font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink-3);font-family:'IBM Plex Sans',sans-serif;font-size:11px;margin-left:6px}
  .n{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px}
  .dim{color:var(--muted)}
  .none{color:var(--ink-3);opacity:.5}
  .old{font-family:var(--mono);font-size:10.5px;color:var(--warn);margin-left:5px}
  /* Multi-stop: the row shows the stop being worked, never every consignee */
  .ofn{display:inline-block;min-width:31px;margin-right:7px;padding:0 5px;border-radius:5px;font-family:var(--mono);font-size:11px;font-weight:600;
    text-align:center;color:var(--accent-hi);background:var(--accent-deep);border:1px solid color-mix(in srgb,var(--accent) 38%,transparent)}
  tr[data-s="done"] .ofn{color:var(--ink-3);background:var(--panel-2);border-color:var(--line)}
  .ofn.solo{visibility:hidden}
  /* Status is a 3px stripe, not a badge — that's what buys the width */
  td.st{position:relative;padding-left:16px!important;font-size:12px;color:var(--muted)}
  td.st::before{content:"";position:absolute;left:5px;top:50%;transform:translateY(-50%);width:3px;height:14px;border-radius:2px;background:var(--ink-3)}
  tr[data-s="rolling"] td.st::before{background:var(--ok)}
  /* The one glow left in the app: signal, not decoration */
  tr[data-s="late"] td.st::before{background:var(--late);box-shadow:0 0 7px color-mix(in srgb,var(--late) 65%,transparent)}
  tr[data-s="late"] td.st{color:var(--late)}
  tr[data-s="risk"] td.st::before{background:var(--warn)}
  tr[data-s="risk"] td.st{color:var(--warn)}
  tr[data-s="done"] td.st::before{background:var(--accent)}
  .flag{display:inline-block;min-width:23px;padding:0 3px;height:16px;line-height:15px;text-align:center;border-radius:5px;font-family:var(--ui);
    font-size:9.5px;font-weight:700;letter-spacing:.03em;margin-right:3px;border:1px solid var(--line);color:var(--ink-3);background:var(--panel-2)}
  .flag.on{border-color:color-mix(in srgb,var(--late) 55%,var(--line));color:var(--late);background:color-mix(in srgb,var(--late) 14%,transparent)}
  .flag.warn{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
  .empty{padding:26px 16px;color:var(--muted);text-align:center}
  /* Hours of service next to the driver: the lowest of drive, shift and cycle left */
  .hos{display:inline-block;margin-left:6px;padding:0 5px;border-radius:5px;font-family:var(--mono);font-size:11px;font-weight:600;
    border:1px solid var(--line);color:var(--muted);background:var(--panel-2);vertical-align:1px}
  .hos.low{color:var(--late);border-color:color-mix(in srgb,var(--late) 55%,var(--line));background:color-mix(in srgb,var(--late) 12%,transparent)}
  .hos.mid{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}
  .hos.old{opacity:.55;border-style:dashed}

  .legend{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;padding:9px 2px 0}
  .legend .lgl{font-family:var(--ui);font-size:9.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
  .legend .li{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
  .foot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:8px 2px 0;font-size:12px;color:var(--ink-3)}
  .closed tr{opacity:.72}
  .error{color:var(--late);padding:10px 14px}
  #nc-done{margin-bottom:8px;padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
</style>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <div class="brand">Road<span>Coda</span></div>
  <nav style="display:flex;gap:14px;font-size:14px"><a href="index.html">Home</a><a class="on" href="dispatch.html">Dispatch</a><a href="loads.html">Loads</a><a href="customers.html">Customers</a><a href="drivers.html">Drivers</a><a href="equipment.html">Equipment</a><a href="rates.html">Rates</a><a href="invoices.html">Invoices</a><a href="tolls.html">Tolls</a><a href="integrations.html">Integrations</a><a href="driver.html">Driver app</a></nav>
  <div class="who" id="who"></div>
  <button class="btn small" id="signout" hidden>Sign out</button>
</header>

<main>
  <section id="login-view" class="card login" hidden>
    <h2>Sign in</h2>
    <label for="email">Email<input id="email" type="email" autocomplete="username"></label>
    <label for="password">Password<input id="password" type="password" autocomplete="current-password"></label>
    <button class="btn primary" id="login-btn">Sign in</button>
    <div class="error" id="login-error" style="padding:0"></div>
  </section>

  <section id="office-view" hidden>
    <div class="bar">
      <h1>Dispatch board</h1>
      <div class="cnt" aria-live="polite">
        <span><b id="c-open">–</b> open</span>
        <span class="red"><b id="c-now">–</b> act now</span>
        <span><b id="c-late">–</b> running late</span>
      </div>
      <span class="sp"></span>
      <label class="sr" for="day" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Service date</label>
      <input id="day" type="date" aria-label="Service date">
      <button class="btn small" id="refresh">Refresh</button>
      <a class="btn small" href="messages.html" id="msgs-btn">Messages</a>
      <a class="btn small" href="templates.html">Templates</a>
      <button class="btn small" id="nc-btn">+ New customer</button>
      <a class="btn small primary" href="loads.html?new=1">New load</a>
    </div>
    <div class="card" id="nc-done" hidden role="status"></div>

    <div class="card">
      <div class="boardwrap">
        <table class="board">
          <thead><tr><th>Load</th><th>Truck</th><th>Trailer</th><th>Driver</th><th>Customer</th><th>Stop</th><th>PU</th><th>DEL</th><th>Status</th><th>Flags</th><th style="text-align:right">Miles</th></tr></thead>
          <tbody id="board"></tbody>
        </table>
      </div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="foot" id="foot"></div>
    <div class="card closed" id="closed" hidden style="margin-top:8px">
      <div class="boardwrap"><table class="board"><tbody id="closed-body"></tbody></table></div>
    </div>
  </section>
</main>

<script>
if (!window.RC_CONFIG || !/^(sb_publishable_|eyJ)/.test(RC_CONFIG.SUPABASE_KEY || '')) {
  document.body.innerHTML = '<div style="max-width:560px;margin:60px auto;padding:20px;background:#fff;border:1px solid #e2ddd3;border-radius:12px;font-family:system-ui;line-height:1.5">' +
    '<h2 style="margin-top:0">RoadCoda can\'t find its settings</h2>' +
    (window.RC_CONFIG ? '<p><b>config.js</b> still has the placeholder key. Open it and paste your Publishable key (Supabase &gt; Project Settings &gt; API Keys).</p>'
                      : '<p><b>config.js</b> was not found next to this page. Unzip the whole kit into a normal folder, then open the page from that folder.</p>') + '</div>';
  throw new Error('RoadCoda settings missing');
}
const sb = supabase.createClient(RC_CONFIG.SUPABASE_URL, RC_CONFIG.SUPABASE_KEY);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isoDay = (d) => { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 10); };
const todayISO = () => isoDay(new Date());
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return isoDay(d); };
const hm = (t) => t ? new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false }) : '';
const md = (iso) => { const [, m, d] = iso.split('-'); return `${+m}/${+d}`; };
const mins = (n) => n >= 90 ? `${Math.floor(n / 60)}h ${String(n % 60).padStart(2, '0')}m` : `${n}m`;

// Trips that finished but were never verified stay on the board this many days back.
const LOOKBACK_DAYS = 14;

let profile = null, showClosed = false, timer = null;
try { showClosed = localStorage.getItem('rc-board-closed') === 'open'; } catch (e) {}

async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showLogin();
  const { data, error } = await sb.from('profiles').select('role, full_name, carriers(name)').eq('user_id', session.user.id).single();
  if (error || !data) { $('login-error').textContent = 'This login is not linked to a carrier yet.'; return showLogin(); }
  if (data.role === 'driver') { location.href = 'driver.html'; return; }
  profile = data;
  $('who').textContent = `${data.full_name || session.user.email} · ${data.carriers?.name || ''} · ${data.role}`;
  $('signout').hidden = false; $('login-view').hidden = true; $('office-view').hidden = false;
  const q = new URLSearchParams(location.search).get('day');
  $('day').value = /^\d{4}-\d{2}-\d{2}$/.test(q || '') ? q : todayISO();
  await loadBoard();
  // Keep it current without a click. A minute is often enough to catch a
  // truck going late and rare enough not to hammer the database.
  timer = setInterval(() => { if (!document.hidden) loadBoard(true); }, 60000);
}
function showLogin() { $('login-view').hidden = false; $('office-view').hidden = true; $('signout').hidden = true; $('who').textContent = ''; }

$('login-btn').onclick = async () => {
  $('login-error').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
  if (error) { $('login-error').textContent = error.message; return; }
  start();
};
$('signout').onclick = async () => { await sb.auth.signOut(); location.reload(); };
$('refresh').onclick = () => loadBoard();
$('day').onchange = () => { history.replaceState(null, '', '?day=' + $('day').value); loadBoard(); };
$('nc-btn').onclick = () => RCNewCustomer.open(sb, (c) => {
  const box = $('nc-done'), id = encodeURIComponent(c.id);
  box.innerHTML = `<span style="flex-grow:1"><b>${esc(c.name)}</b> added as a customer.</span>
    <a class="btn small" href="rates.html?customer=${id}">Set rates &amp; contract</a>
    <a class="btn small primary" href="loads.html?new=1&customer=${id}">New load for them</a>`;
  box.hidden = false;
});

// ── Flags ────────────────────────────────────────────────────────────
// One table defines every flag: trip_check_codes in the database. The cells,
// the tooltips and the legend all read from it, so they can't drift apart.
// Red blocks invoicing and payroll; amber does not.
let FLAGDEF = {};
async function loadFlagDefs() {
  if (Object.keys(FLAGDEF).length) return;
  const { data } = await sb.from('trip_check_codes').select('code, label, what, blocks, severity, sort').order('sort');
  (data || []).forEach(f => { FLAGDEF[f.code] = f; });
}
const flagHtml = (code) => {
  const f = FLAGDEF[code] || { label: code, what: '', blocks: false };
  return `<span class="flag ${f.blocks ? 'on' : 'warn'}" title="${esc(f.label + (f.what ? ' — ' + f.what : ''))}">${esc(code)}</span>`;
};

const DONE = ['delivered', 'exception'];

// ── Hours of service ────────────────────────────────────────────────
let HOS = {}, UNREAD = {}, DRV2 = {};
const hmm = (m) => m == null ? '–' : `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`;
const DUTYNAME = { off: 'Off duty', sleeper: 'Sleeper', on: 'On duty', driving: 'Driving', yard: 'Yard move', personal: 'Personal conveyance', waiting: 'Waiting', unknown: 'Status unknown' };
function hosTag(driverId) {
  const h = HOS[driverId]; if (!h) return '';
  const left = [h.drive_left_min, h.shift_left_min, h.cycle_left_min].filter(x => x != null);
  if (!left.length) return '';
  const low = Math.min(...left);
  const cls = h.stale ? 'old' : low < 60 ? 'low' : low < 120 ? 'mid' : '';
  const tip = `${DUTYNAME[h.duty_status] || h.duty_status} · drive ${hmm(h.drive_left_min)} · shift ${hmm(h.shift_left_min)} · cycle ${hmm(h.cycle_left_min)}` +
    (h.break_left_min != null ? ` · break due in ${hmm(h.break_left_min)}` : '') + ` · from the ELD ${h.age_min} min ago${h.stale ? ' — not current' : ''}`;
  return `<span class="hos ${cls}" title="${esc(tip)}">${hmm(low)}</span>`;
}

// Work out one load's row: where it is, how it's doing, which band it sits in.
function describe(l, ctx) {
  const stops = (l.stops || []).slice().sort((a, b) => a.seq - b.seq);
  const n = stops.length;
  const cur = stops.find(s => !DONE.includes(s.status));
  const finished = n > 0 && !cur;
  const at = cur ? stops.indexOf(cur) + 1 : n;
  const shown = cur || stops[n - 1];
  const now = Date.now();
  const flags = ctx.flags[l.id];                       // finished trips only (41)
  const openDelay = ctx.openDelays[l.id] || 0;         // departed stops with no code
  const dwell = ctx.dwell[l.id];                       // truck at a dock right now
  const codes = new Set(flags ? flags.codes : []);
  if (openDelay) codes.add('DT');
  if (dwell && dwell.over_min > 0) codes.add('DT');

  let s = 'idle', label = '', band = 0, why = '';
  if (finished) {
    s = 'done';
    label = flags ? (flags.blocking ? 'Needs close-out' : 'Flagged') : 'Ready to verify';
    if (flags && flags.rank === 1) { band = 2; why = 'Finished — something here can be fixed from this desk now'; }
    else if (codes.size) { band = 1; why = 'Finished — paperwork and data still to collect'; }
    else why = 'Finished and clean — verify it to take it off the board';
  } else if (l.status === 'planned' || !l.driver_id) {
    // Not rolling yet. It only turns red once the first appointment has
    // slipped past with nobody on it.
    const start = cur.window_end || cur.window_start;
    s = 'idle'; label = !l.driver_id ? 'No driver' : 'Planned';
    if (start && now > new Date(start).getTime() && !cur.arrived_at) {
      s = 'late'; band = 2; label = `Not started +${mins(Math.round((now - new Date(start).getTime()) / 60000))}`;
      why = 'The first appointment has passed and this load has not started';
    }
  } else if (cur && cur.arrived_at && !cur.departed_at) {
    if (dwell && dwell.over_min > 0) {
      s = 'late'; band = 2; label = `Detention +${mins(dwell.over_min)}`;
      why = `On site ${mins(dwell.on_site_min)} against ${dwell.free_min}m free time — a delay code will be needed`;
    } else {
      s = 'rolling'; label = 'At stop';
      if (dwell) { const left = dwell.free_min - dwell.on_site_min; if (left <= 15) { s = 'risk'; label = `At stop · ${Math.max(0, left)}m free left`; } }
    }
  } else if (cur) {
    const end = cur.window_end ? new Date(cur.window_end).getTime() : null;
    const eta = cur.eta ? new Date(cur.eta).getTime() : null;
    if (end && ((eta && eta > end) || now > end)) {
      const over = Math.round(((eta && eta > end ? eta : now) - end) / 60000);
      s = 'late'; band = 2; label = `Late +${mins(over)}`; why = 'Running late — the truck is still out';
    } else if (end && end - now <= 3600e3) {
      s = 'risk'; label = `Due ${hm(cur.window_end)}`;
    } else {
      s = 'rolling'; label = l.status === 'dispatched' ? 'Dispatched' : 'En route';
    }
  }
  if (!finished && openDelay && band < 2) { band = 2; why = why || 'A stop went past free time and still has no delay code'; }

  // PU = the first stop's appointment; DEL = the stop being worked (or the last one)
  const first = stops[0];
  const appt = shown ? (shown.window_end || shown.window_start || shown.eta) : null;
  return { l, stops, n, at, shown, first, finished, s, label, band, why, codes: [...codes].sort((a, b) => (FLAGDEF[a]?.sort ?? 99) - (FLAGDEF[b]?.sort ?? 99)),
           sortKey: appt ? new Date(appt).getTime() : Infinity };
}

function rowHtml(r, day) {
  const l = r.l, tractor = l.equipment?.unit_type === 'tractor';
  const trailer = l.bobtail ? '<span class="dim">bobtail</span>' : r.trailer || (tractor ? '<span class="none">—</span>' : '');
  const old = l.service_date !== day ? `<span class="old" title="Service date ${esc(l.service_date)}">${md(l.service_date)}</span>` : '';
  const pu = r.first ? hm(r.first.window_start || r.first.window_end || r.first.eta) : '';
  const del = r.shown ? hm(r.shown.window_end || r.shown.window_start || r.shown.eta) : '';
  const name = r.shown ? r.shown.consignee : '<span class="none">no stops</span>';
  return `<tr data-s="${r.s}" data-load="${l.id}" tabindex="0" title="${esc(r.why || 'Open load ' + l.load_no)}">
    <td class="n">${esc(l.load_no)}${old}</td>
    <td class="n">${esc(l.equipment?.unit_no || '')}</td>
    <td class="n dim">${trailer}</td>
    <td>${l.drivers?.full_name ? esc(l.drivers.full_name) + (l.driver2_id && DRV2[l.driver2_id] ? ` <span class="dim">+ ${esc(DRV2[l.driver2_id])}</span>` : '') + (r.finished ? '' : hosTag(l.driver_id)) + (UNREAD[l.driver_id] ? `<a href="messages.html?driver=${l.driver_id}" class="hos low" style="text-decoration:none" title="${UNREAD[l.driver_id]} unread message${UNREAD[l.driver_id] > 1 ? 's' : ''} from this driver">✉ ${UNREAD[l.driver_id]}</a>` : '') : '<span class="none">—</span>'}</td>
    <td class="dim">${esc(l.customers?.name || '')}</td>
    <td><span class="ofn${r.n > 1 ? '' : ' solo'}">${r.at}/${r.n}</span>${r.shown ? esc(name) : name}</td>
    <td class="n">${pu}</td>
    <td class="n">${del}</td>
    <td class="st">${esc(r.label)}</td>
    <td>${r.codes.map(flagHtml).join('')}</td>
    <td class="n dim" style="text-align:right">${l.miles ? Math.round(l.miles) + ' mi' : ''}</td></tr>`;
}

let loading = false;
async function loadBoard(quiet) {
  if (loading) return; loading = true;
  try {
    // Late notices to customers are found and sent from here, as before.
    try { await sb.functions.invoke('send-notifications'); } catch (_) {}
    await loadFlagDefs();
    const day = $('day').value, from = addDays(day, -LOOKBACK_DAYS);

    const [loadsR, flagsR, delaysR, dwellR, closeR, trailersR, hosR, msgR] = await Promise.all([
      sb.from('loads')
        .select('id, load_no, status, service_date, miles, driver_id, driver2_id, truck_id, trailer_id, trailer2_id, bobtail, customers(name), drivers(full_name), equipment(unit_no, unit_type), stops(id, seq, consignee, stop_type, window_start, window_end, eta, arrived_at, departed_at, status)')
        .gte('service_date', from).lte('service_date', day).neq('status', 'cancelled').order('load_no'),
      sb.from('load_check_flags').select('load_id, rank, blocking, codes'),
      sb.from('load_open_delays').select('load_id, open_delays'),
      sb.from('live_stop_dwell').select('load_id, stop_id, on_site_min, free_min, over_min'),
      sb.from('load_closeout').select('load_id, dispatch_at, billing_at, locked_at'),
      sb.from('equipment').select('id, unit_no').eq('unit_type', 'trailer'),
      // hours of service (46); a carrier without an ELD simply has none
      sb.from('driver_hos_now').select('driver_id, duty_status, age_min, stale, drive_left_min, shift_left_min, cycle_left_min, break_left_min'),
      sb.from('message_threads').select('driver_id, unread').gt('unread', 0),
    ]);
    UNREAD = {}; (msgR.error ? [] : msgR.data || []).forEach(m => UNREAD[m.driver_id] = m.unread);
    if (!Object.keys(DRV2).length) { const dr = await sb.from('drivers').select('id, full_name'); (dr.data || []).forEach(d => DRV2[d.id] = d.full_name); }
    const totalUnread = Object.values(UNREAD).reduce((a, b) => a + b, 0);
    $('msgs-btn').innerHTML = totalUnread ? `Messages <b style="margin-left:4px;color:var(--late)">${totalUnread}</b>` : 'Messages';
    HOS = {}; (hosR.error ? [] : hosR.data || []).forEach(h => HOS[h.driver_id] = h);
    if (loadsR.error) { $('board').innerHTML = `<tr><td colspan="11" class="error">${esc(loadsR.error.message)}</td></tr>`; return; }
    const missing = [flagsR, delaysR, dwellR, closeR].find(r => r.error);
    if (missing) { $('board').innerHTML = `<tr><td colspan="11" class="error">${esc(missing.error.message)} — run 41_trip_closeout.sql and 42_dispatch_board.sql in the SQL Editor.</td></tr>`; return; }

    const ctx = { flags: {}, openDelays: {}, dwell: {}, closed: {} };
    flagsR.data.forEach(f => ctx.flags[f.load_id] = f);
    delaysR.data.forEach(d => ctx.openDelays[d.load_id] = d.open_delays);
    dwellR.data.forEach(d => { const c = ctx.dwell[d.load_id]; if (!c || d.over_min > c.over_min) ctx.dwell[d.load_id] = d; });
    closeR.data.forEach(c => ctx.closed[c.load_id] = c);
    const trailers = {}; (trailersR.data || []).forEach(t => trailers[t.id] = t.unit_no);

    // A load leaves the board when dispatch VERIFIES it — not when the driver
    // taps Delivered. A delivered load with no POD is still work.
    const live = [], closed = [];
    for (const l of loadsR.data) {
      const verified = !!ctx.closed[l.id]?.dispatch_at;
      if (verified) { if (l.service_date === day) closed.push(l); continue; }
      const r = describe(l, ctx);
      r.trailer = [l.trailer_id, l.trailer2_id].filter(Boolean).map(id => esc(trailers[id] || '')).join(' + ');
      // Older days only come back if they're finished and still unchecked,
      // or still running (a trip that never got its last stop tapped).
      if (l.service_date !== day && !(r.finished || l.status === 'in_progress')) continue;
      live.push(r);
    }

    const BANDS = [
      [2, 'red', 'Act now', 'late trucks, detention with no code, and anything you can fix from this desk'],
      [1, 'amber', 'Collect after', 'nothing to chase in the moment — paperwork and data'],
      [0, 'clean', 'Running clean', ''],
    ];
    let html = '';
    for (const [band, cls, label, note] of BANDS) {
      // Within a band: trucks still out come first (someone can still change
      // how those end), then finished trips — newest first, so this morning's
      // work isn't buried under last week's paperwork.
      const set = live.filter(r => r.band === band).sort((a, b) =>
        (a.finished - b.finished) ||
        (a.finished ? String(b.l.service_date).localeCompare(String(a.l.service_date)) : 0) ||
        a.sortKey - b.sortKey || String(a.l.load_no).localeCompare(String(b.l.load_no), undefined, { numeric: true }));
      if (!set.length) continue;
      html += `<tr class="grp ${cls}"><td colspan="11">${label} · ${set.length}${note ? `<span class="gnote">${note}</span>` : ''}</td></tr>`;
      html += set.map(r => rowHtml(r, day)).join('');
    }
    $('board').innerHTML = html || `<tr><td colspan="11" class="empty">Nothing open for ${esc(day)}. Every trip on this date has been verified.</td></tr>`;

    $('c-open').textContent = live.length;
    $('c-now').textContent = live.filter(r => r.band === 2).length;
    $('c-late').textContent = live.filter(r => !r.finished && r.s === 'late').length;

    // Legend, from the same table the flags are
    $('legend').innerHTML = '<span class="lgl">Flags</span>' +
      Object.values(FLAGDEF).map(f => `<span class="li">${flagHtml(f.code)}${esc(f.label)}</span>`).join('') +
      '<span class="li"><span class="flag" style="border-color:transparent;background:none;color:var(--late)">red</span>blocks billing</span>' +
      (Object.keys(HOS).length ? '<span class="li"><span class="hos">5:30</span>hours the driver has left (lowest of drive, shift, cycle) — red under 1h</span>' : '') +
      '<span class="li"><span class="flag" style="border-color:transparent;background:none;color:var(--warn)">amber</span>flagged, not blocking</span>';

    // Closed today
    const foot = $('foot');
    foot.innerHTML = `<span>${live.length} open · finished trips stay until dispatch verifies them (up to ${LOOKBACK_DAYS} days back)</span>`;
    if (closed.length) {
      const b = document.createElement('button'); b.className = 'btn small';
      b.textContent = `${showClosed ? 'Hide' : 'Show'} ${closed.length} closed today`;
      b.onclick = () => { showClosed = !showClosed; try { localStorage.setItem('rc-board-closed', showClosed ? 'open' : 'shut'); } catch (e) {} loadBoard(true); };
      foot.appendChild(b);
    }
    $('closed').hidden = !(showClosed && closed.length);
    $('closed-body').innerHTML = closed.map(l => {
      const c = ctx.closed[l.id];
      const r = describe(l, ctx); r.trailer = [l.trailer_id, l.trailer2_id].filter(Boolean).map(id => esc(trailers[id] || '')).join(' + ');
      r.codes = []; r.s = 'done'; r.label = c.locked_at ? 'Locked · approved' : 'Verified · with billing';
      return rowHtml(r, day);
    }).join('');

    document.querySelectorAll('tr[data-load]').forEach(tr => {
      const go = () => { location.href = `trip.html?load=${tr.dataset.load}&day=${day}`; };
      tr.onclick = go;
      tr.onkeydown = (e) => { if (e.key === 'Enter') go(); };
    });
  } finally { loading = false; }
}

start();
</script>
</body>
</html>
