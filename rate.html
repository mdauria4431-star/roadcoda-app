<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>How did we do?</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
  :root{--brand:#0f5e63;--ink:#1c1f24;--muted:#5b6470;--line:#e2e5ea}
  *{box-sizing:border-box} [hidden]{display:none!important}
  body{margin:0;background:#f5f6f8;color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:16px}
  .card{max-width:460px;margin:40px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px 24px;text-align:center}
  img.logo{max-height:48px;max-width:220px;margin-bottom:6px}
  .co{font-family:Archivo,sans-serif;font-weight:800;font-size:18px;color:var(--brand)}
  h1{font-family:Archivo,sans-serif;font-size:24px;margin:18px 0 4px}
  .sub{color:var(--muted);font-size:15px;line-height:1.5}
  .stars{display:flex;justify-content:center;gap:6px;margin:20px 0 6px}
  .stars button{font-size:44px;line-height:1;background:none;border:0;cursor:pointer;color:#d4d8de;padding:2px;transition:transform .1s}
  .stars button.on{color:#f2a900}
  .stars button:active{transform:scale(.9)}
  .lbl{height:22px;color:var(--muted);font-weight:600}
  textarea{width:100%;min-height:90px;margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:15px;resize:vertical}
  button.send{margin-top:14px;width:100%;height:50px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-weight:700;font-size:17px;cursor:pointer}
  button.send:disabled{opacity:.5}
  .ok{font-size:40px;margin-top:10px}
  .err{color:#b3261e}
  .foot{margin-top:18px;font-size:12px;color:#9aa1ab}

  @media (prefers-color-scheme: dark){
    :root{--ink:#e8edf2;--muted:#a3adb8;--line:#2b3642;color-scheme:dark}
    body{background:#0f1419} .card{background:#182029} textarea{background:#10161d;color:var(--ink)}
    .stars button{color:#3a4550}
  }
</style>
</head>
<body>
<div class="card" id="card">
  <img class="logo" id="logo" alt="" hidden><div class="co" id="co"></div>
  <div id="body"><p class="sub">Loading…</p></div>
  <div class="foot">Powered by RoadCoda</div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LABEL = ['', 'Poor', 'Not great', 'OK', 'Good', 'Excellent'];
const q = new URLSearchParams(location.search), tok = q.get('t') || '';
let pick = Math.min(5, Math.max(0, parseInt(q.get('r') || '0', 10) || 0));

(async function () {
  if (!window.RC_CONFIG || !tok) { $('body').innerHTML = '<p class="sub err">This rating link isn\'t complete. Please use the link in your email.</p>'; return; }
  const sb = supabase.createClient(RC_CONFIG.SUPABASE_URL, RC_CONFIG.SUPABASE_KEY, { auth: { persistSession: false } });
  const { data: v, error } = await sb.rpc('rating_lookup', { p_token: tok });
  if (error || !v) { $('body').innerHTML = '<p class="sub err">This rating link isn\'t valid. Please use the link in your latest delivery email.</p>'; return; }
  if (/^#[0-9a-f]{6}$/i.test(v.brand_color || '')) document.documentElement.style.setProperty('--brand', v.brand_color);
  $('co').textContent = v.carrier; document.title = `How did we do? · ${v.carrier}`;
  if (v.logo_path) { $('logo').src = sb.storage.from('brand-logos').getPublicUrl(v.logo_path).data.publicUrl; $('logo').hidden = false; $('logo').onerror = () => $('logo').hidden = true; }
  const when = v.delivered_at ? new Date(v.delivered_at).toLocaleString([], { weekday: 'long', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
  if (!v.open) { $('body').innerHTML = `<h1>Thanks for your delivery</h1><p class="sub">This rating link has expired.${v.score ? ` You rated this delivery ${v.score} out of 5.` : ''}</p>`; return; }
  if (!pick && v.score) pick = v.score;
  // Nothing is recorded until "Send" is tapped: email security scanners open links on their own.
  $('body').innerHTML = `
    <h1>How did we do?</h1>
    <p class="sub">Your delivery at <b>${esc(v.location)}</b>${when ? `<br>${esc(when)}` : ''}${v.driver ? ` · driver ${esc(v.driver)}` : ''}</p>
    <div class="stars" id="stars">${[1, 2, 3, 4, 5].map(n => `<button data-n="${n}" aria-label="${n} star${n > 1 ? 's' : ''}">★</button>`).join('')}</div>
    <div class="lbl" id="lbl"></div>
    <textarea id="comment" maxlength="1000" placeholder="Anything we should know? (optional)">${esc(v.comment || '')}</textarea>
    <button class="send" id="send">${v.score ? 'Update my rating' : 'Send'}</button>
    <div id="msg" class="sub" style="margin-top:10px"></div>`;
  const draw = () => { document.querySelectorAll('#stars button').forEach(b => b.classList.toggle('on', +b.dataset.n <= pick)); $('lbl').textContent = LABEL[pick] || 'Tap a star'; $('send').disabled = !pick; };
  document.querySelectorAll('#stars button').forEach(b => b.onclick = () => { pick = +b.dataset.n; draw(); });
  draw();
  $('send').onclick = async () => {
    $('send').disabled = true;
    const { error: e } = await sb.rpc('rating_submit', { p_token: tok, p_score: pick, p_comment: $('comment').value });
    if (e) { $('msg').innerHTML = `<span class="err">${esc(e.message)}</span>`; $('send').disabled = false; return; }
    $('body').innerHTML = `<div class="ok">${pick >= 4 ? '🙌' : pick === 3 ? '👍' : '🙏'}</div><h1>Thank you</h1><p class="sub">${pick <= 2
      ? `We're sorry this delivery fell short. ${esc(v.carrier)} will look into it.`
      : `Your feedback goes straight to ${esc(v.carrier)}.`} You can change your rating from the same email for the next two weeks.</p>`;
  };
})();
</script>
</body>
</html>
