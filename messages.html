<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messages · RoadCoda</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#070c14">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js" integrity="sha384-xPW3QHswsICVC2mW6BFNwMbhpLkbZ133fKOhxNx3QGGgAOJfL3O9t8r2aWn1aez6" crossorigin="anonymous"></script>
<script src="config.js"></script>
<script src="access.js"></script>
<script src="shell.js"></script>
<style>
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px}
  button{font-family:inherit;cursor:pointer}
  .btn{height:32px;padding:0 13px;border-radius:8px;border:1px solid var(--line);font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
  main{padding:14px 16px 20px!important}
  .login{max-width:380px;margin:60px auto;display:flex;flex-direction:column;gap:12px;padding:20px}
  label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:12.5px}
  input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:0 9px;font-family:inherit;font-size:13.5px;color:var(--ink)}
  input,select{height:34px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .layout{display:grid;grid-template-columns:300px 1fr;gap:12px;height:calc(100vh - 90px);min-height:420px}
  @media (max-width:800px){.layout{grid-template-columns:1fr;height:auto}}
  .list{display:flex;flex-direction:column;overflow:auto}
  .list .head{padding:10px 12px;border-bottom:1px solid var(--line-soft);display:flex;gap:8px;align-items:center}
  .list .head input{flex:1;height:30px}
  .th{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line-soft);cursor:pointer}
  .th:hover{background:var(--row-hover)}
  .th.on{background:color-mix(in srgb,var(--accent) 14%,transparent);box-shadow:inset 3px 0 0 var(--accent)}
  .th .w{flex:1;min-width:0}
  .th b{font-family:var(--ui);font-weight:600}
  .th .last{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .th .when{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
  .badge{min-width:20px;height:20px;border-radius:10px;background:var(--late);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 6px}
  .chat{display:flex;flex-direction:column;min-height:0}
  .chat .top{padding:10px 14px;border-bottom:1px solid var(--line-soft);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .chat .top h2{margin:0;font-size:15px;text-transform:none;letter-spacing:0;color:var(--ink)}
  .msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--panel-2)}
  .m{max-width:72%;padding:8px 12px;border-radius:12px;font-size:13.5px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
  .m.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
  .m.us{align-self:flex-end;background:var(--accent-deep);border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line))}
  .m .meta{font-size:11px;color:var(--ink-3);margin-top:3px;font-family:var(--mono)}
  .m .ld{font-size:11px;color:var(--accent-hi);margin-bottom:2px;font-family:var(--mono)}
  .day{align-self:center;font-size:11px;color:var(--ink-3);font-family:var(--mono);margin:6px 0}
  .compose{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line-soft);align-items:end;flex-wrap:wrap}
  .compose textarea{flex:1;min-width:220px;height:56px;padding:8px 10px;resize:vertical}
  .empty{padding:20px;color:var(--muted);font-size:13px}
  .error{color:var(--late)}
  .mini{font-size:11.5px;color:var(--ink-3)}
</style>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <div class="brand">Road<span>Coda</span></div>
  <nav style="display:flex;gap:14px;font-size:14px"><a href="index.html">Home</a><a href="dispatch.html">Dispatch</a><a class="on" href="messages.html">Messages</a><a href="loads.html">Loads</a><a href="customers.html">Customers</a><a href="drivers.html">Drivers</a><a href="equipment.html">Equipment</a><a href="rates.html">Rates</a><a href="invoices.html">Invoices</a><a href="tolls.html">Tolls</a><a href="integrations.html">Integrations</a><a href="driver.html">Driver app</a></nav>
  <div class="who" id="who"></div>
  <button class="btn small" id="signout" hidden>Sign out</button>
</header>

<main>
  <section id="login-view" class="card login" hidden>
    <h2>Sign in</h2>
    <label for="email">Email<input id="email" type="email" autocomplete="username"></label>
    <label for="password">Password<input id="password" type="password" autocomplete="current-password"></label>
    <button class="btn primary" id="login-btn">Sign in</button>
    <div class="error" id="login-error"></div>
  </section>

  <section id="app" hidden>
    <div class="layout">
      <div class="card list">
        <div class="head"><input id="q" placeholder="Find a driver" aria-label="Find a driver"></div>
        <div id="threads"></div>
      </div>
      <div class="card chat">
        <div class="top"><h2 id="who2">Pick a driver</h2><span class="mini" id="state"></span><span style="flex:1"></span><select id="load" aria-label="About which load" hidden></select></div>
        <div class="msgs" id="msgs"><div class="empty">Messages to and from each driver show here. While a truck is moving, the driver hears a chime and reads it when stopped.</div></div>
        <div class="compose" id="compose" hidden>
          <textarea id="text" maxlength="1000" placeholder="Message the driver… (Enter sends, Shift+Enter for a new line)"></textarea>
          <button class="btn primary" id="send">Send</button>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
if (!window.RC_CONFIG || !/^(sb_publishable_|eyJ)/.test(RC_CONFIG.SUPABASE_KEY || '')) {
  document.body.innerHTML = '<div style="max-width:560px;margin:60px auto;padding:20px;background:#fff;border-radius:12px;font-family:system-ui">RoadCoda can\'t find config.js or its key.</div>';
  throw new Error('RoadCoda settings missing');
}
const sb = supabase.createClient(RC_CONFIG.SUPABASE_URL, RC_CONFIG.SUPABASE_KEY);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hm = (t) => new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const dayLabel = (t) => { const d = new Date(t), today = new Date(); const y = new Date(); y.setDate(y.getDate() - 1);
  return d.toDateString() === today.toDateString() ? 'Today' : d.toDateString() === y.toDateString() ? 'Yesterday' : d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }); };
const ago = (t) => { const m = Math.round((Date.now() - new Date(t)) / 60000); return m < 1 ? 'now' : m < 60 ? m + 'm' : m < 1440 ? Math.round(m / 60) + 'h' : dayLabel(t); };
const canSend = () => !window.RC_ACCESS || window.RC_ACCESS.can('dispatch', 'edit');

let THREADS = [], CUR = null, LOADS = [], NAMES = {}, lastCount = 0;

async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('login-view').hidden = false; return; }
  const { data } = await sb.from('profiles').select('role, full_name, carriers(name)').eq('user_id', session.user.id).single();
  if (!data) { $('login-view').hidden = false; $('login-error').textContent = 'This login is not linked to a carrier.'; return; }
  if (data.role === 'driver') { location.href = 'driver.html'; return; }
  $('who').textContent = `${data.full_name || session.user.email} · ${data.carriers?.name || ''} · ${data.role}`;
  $('signout').hidden = false;
  await window.RC_ACCESS_READY;
  if (window.RC_ACCESS && !window.RC_ACCESS.can('dispatch')) return;
  $('app').hidden = false;
  await loadThreads();
  const q = new URLSearchParams(location.search).get('driver');
  if (q) openThread(q);
  setInterval(() => { if (!document.hidden) { loadThreads(); if (CUR) loadChat(true); } }, 10000);
}
$('login-btn').onclick = async () => { const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value }); if (error) { $('login-error').textContent = error.message; return; } location.reload(); };
$('signout').onclick = async () => { await sb.auth.signOut(); location.reload(); };
$('q').oninput = () => drawThreads();

async function loadThreads() {
  const { data, error } = await sb.from('message_threads').select('*').eq('active', true);
  if (error) { $('threads').innerHTML = `<div class="empty error">${esc(error.message)}${/message_threads|schema cache/.test(error.message) ? ' — run 54_messages.sql in the SQL Editor.' : ''}</div>`; return; }
  THREADS = (data || []).sort((a, b) => (b.unread - a.unread) || String(b.last_at || '').localeCompare(String(a.last_at || '')) || a.full_name.localeCompare(b.full_name));
  drawThreads();
}
function drawThreads() {
  const q = $('q').value.trim().toLowerCase();
  $('threads').innerHTML = THREADS.filter(t => !q || t.full_name.toLowerCase().includes(q)).map(t => `
    <div class="th ${CUR === t.driver_id ? 'on' : ''}" data-d="${t.driver_id}">
      <div class="w"><b>${esc(t.full_name)}</b><div class="last">${t.last_body ? (t.last_from_driver ? '' : 'You: ') + esc(t.last_body) : '<span class="mini">No messages yet</span>'}</div></div>
      <div style="text-align:right">${t.last_at ? `<div class="when">${ago(t.last_at)}</div>` : ''}${t.unread ? `<div class="badge" style="margin-left:auto;margin-top:3px">${t.unread}</div>` : ''}</div>
    </div>`).join('') || '<div class="empty">No drivers.</div>';
  document.querySelectorAll('.th').forEach(el => el.onclick = () => openThread(el.dataset.d));
}

async function openThread(id) {
  CUR = id; history.replaceState(null, '', '?driver=' + id); drawThreads();
  const t = THREADS.find(x => x.driver_id === id);
  $('who2').textContent = t ? t.full_name : 'Driver';
  $('compose').hidden = !canSend();
  // the loads a message can be about: the driver's running and recent ones
  const { data: ls } = await sb.from('loads').select('id, load_no, status, service_date').eq('driver_id', id)
    .in('status', ['planned', 'dispatched', 'in_progress', 'delivered']).order('service_date', { ascending: false }).limit(8);
  LOADS = ls || [];
  const cur = LOADS.find(l => l.status === 'in_progress') || LOADS.find(l => l.status === 'dispatched');
  $('load').innerHTML = '<option value="">Not about a load</option>' + LOADS.map(l => `<option value="${l.id}"${cur && cur.id === l.id ? ' selected' : ''}>About load ${esc(l.load_no)} · ${esc(l.status.replace('_', ' '))}</option>`).join('');
  $('load').hidden = !LOADS.length || !canSend();
  lastCount = 0;
  await loadChat();
  $('text').focus();
}
async function loadChat(quiet) {
  const { data, error } = await sb.from('messages').select('id, load_id, from_driver, sender_user, body, quick, created_at, delivered_at, read_at, loads(load_no)')
    .eq('driver_id', CUR).order('created_at').limit(300);
  if (error) { $('msgs').innerHTML = `<div class="empty error">${esc(error.message)}</div>`; return; }
  const ms = data || [];
  const who = [...new Set(ms.filter(m => !m.from_driver && m.sender_user && !NAMES[m.sender_user]).map(m => m.sender_user))];
  if (who.length) { const n = await sb.rpc('carrier_user_names', { p_ids: who }); (n.data || []).forEach(r => NAMES[r.user_id] = r.full_name); }
  if (ms.some(m => m.from_driver && !m.read_at)) { await sb.rpc('office_messages_read', { p_driver: CUR }); loadThreads(); }
  if (quiet && ms.length === lastCount && !ms.some(m => !m.from_driver && !m.read_at)) return;   // nothing new
  lastCount = ms.length;
  let html = '', lastDay = '';
  for (const m of ms) {
    const d = dayLabel(m.created_at); if (d !== lastDay) { html += `<div class="day">${d}</div>`; lastDay = d; }
    const status = m.from_driver ? '' : m.read_at ? ` · seen ${hm(m.read_at)}` : m.delivered_at ? ' · on the phone, not seen yet' : ' · waiting for the phone';
    html += `<div class="m ${m.from_driver ? 'them' : 'us'}">${m.loads?.load_no ? `<div class="ld">Load ${esc(m.loads.load_no)}</div>` : ''}${esc(m.body)}
      <div class="meta">${m.from_driver ? '' : esc(NAMES[m.sender_user] || 'Office') + ' · '}${hm(m.created_at)}${status}</div></div>`;
  }
  $('msgs').innerHTML = html || '<div class="empty">No messages with this driver yet.</div>';
  $('msgs').scrollTop = $('msgs').scrollHeight;
  const unseen = ms.filter(m => !m.from_driver && !m.read_at).length;
  $('state').textContent = unseen ? `${unseen} not seen yet — the truck may be moving` : '';
}
async function send() {
  const body = $('text').value.trim(); if (!body || !CUR) return;
  $('send').disabled = true;
  const { error } = await sb.rpc('message_driver', { p_driver: CUR, p_body: body, p_load: $('load').value || null });
  $('send').disabled = false;
  if (error) { alert(error.message); return; }
  $('text').value = ''; await loadChat(); loadThreads();
}
$('send').onclick = send;
$('text').onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };

start();
</script>
</body>
</html>
