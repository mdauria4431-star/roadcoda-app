<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What's new · RoadCoda</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#070c14">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js" integrity="sha384-xPW3QHswsICVC2mW6BFNwMbhpLkbZ133fKOhxNx3QGGgAOJfL3O9t8r2aWn1aez6" crossorigin="anonymous"></script>
<script src="config.js"></script>
<script src="access.js"></script>
<script src="whats-new.js"></script>
<script src="shell.js"></script>
<link rel="stylesheet" href="app.css">
<style>
  *{box-sizing:border-box} [hidden]{display:none!important}
  body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px}
  main{padding:14px 16px 40px!important;display:flex;flex-direction:column;gap:12px;max-width:860px}
  h1{margin:0;font-size:19px}
  .login{max-width:380px;margin:60px auto;display:flex;flex-direction:column;gap:12px;padding:20px}
  label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:12.5px}
  input{height:32px;border:1px solid var(--line);border-radius:8px;padding:0 9px;font-family:inherit;font-size:13px;color:var(--ink)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
  .btn{height:32px;padding:0 13px;border-radius:8px;border:1px solid var(--line);font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
  .error{color:var(--late)}
  .intro{color:var(--muted);margin:0}
  .item{padding:16px 18px;display:flex;flex-direction:column;gap:8px}
  .item h2{margin:0;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;text-transform:none;letter-spacing:0;color:var(--ink)}
  .item p{margin:0;line-height:1.55;color:var(--ink-2)}
  .date{font-size:12px;color:var(--muted);font-weight:500}
  .new{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--accent);color:#fff}
  .item .btn{align-self:flex-start}
  .empty{padding:16px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="brand">Road<span>Coda</span></div>
  <nav style="display:flex;gap:14px;font-size:14px"><a href="index.html">Home</a><a href="dispatch.html">Dispatch</a><a href="loads.html">Loads</a><a href="customers.html">Customers</a><a href="drivers.html">Drivers</a><a href="equipment.html">Equipment</a><a href="driver.html">Driver app</a></nav>
  <div class="who" id="who"></div>
  <button class="btn small" id="signout" hidden>Sign out</button>
</header>
<main>
  <section id="login-view" class="card login" hidden>
    <h2>Sign in</h2>
    <label for="email">Email<input id="email" type="email" autocomplete="username"></label>
    <label for="password">Password<input id="password" type="password" autocomplete="current-password"></label>
    <button class="btn primary" id="login-btn">Sign in</button>
    <div class="error" id="login-error"></div>
  </section>
  <section id="app" hidden style="display:flex;flex-direction:column;gap:12px">
    <h1>What's new in RoadCoda</h1>
    <p class="intro">New things you can use, newest first. Only what your login can open is shown. Questions? Use "Report a problem" at the bottom of the menu.</p>
    <div id="list"></div>
  </section>
</main>
<script>
if (!window.RC_CONFIG || !/^(sb_publishable_|eyJ)/.test(RC_CONFIG.SUPABASE_KEY || '')) {
  document.body.innerHTML = '<div style="max-width:560px;margin:60px auto;padding:20px;background:#fff;border-radius:12px;font-family:system-ui">RoadCoda can\'t find config.js or its key.</div>';
  throw new Error('RoadCoda settings missing');
}
const sb = supabase.createClient(RC_CONFIG.SUPABASE_URL, RC_CONFIG.SUPABASE_KEY);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const day = (d) => { const [y, m, dd] = d.split('-').map(Number); return `${MON[m - 1]} ${dd}, ${y}`; };
async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('login-view').hidden = false; return; }
  const { data } = await sb.from('profiles').select('role, full_name, carriers(name)').eq('user_id', session.user.id).single();
  if (!data) { $('login-view').hidden = false; $('login-error').textContent = 'This login is not linked to a carrier.'; return; }
  if (data.role === 'driver') { location.href = 'driver.html'; return; }
  $('who').textContent = `${data.full_name || session.user.email} · ${data.carriers?.name || ''} · ${data.role}`;
  $('signout').hidden = false;
  await window.RC_ACCESS_READY;
  $('app').hidden = false;
  const L = window.RC_WN.mine(window.RC_ACCESS);
  $('list').innerHTML = L.length ? L.map(e => `<article class="card item"><h2>${window.RC_WN.isNew(e) ? '<span class="new">New</span>' : ''}${esc(e.title)} <span class="date">${day(e.date)}</span></h2>
      <p>${esc(e.body)}</p>${e.link ? `<a class="btn" href="${esc(e.link)}">${esc(e.linkText || 'Open it')} →</a>` : ''}</article>`).join('')
    : '<div class="card empty">Nothing new right now.</div>';
  window.RC_WN.markSeen();
  document.querySelectorAll('.rc-wn-badge').forEach(b => b.remove());
}
$('login-btn').onclick = async () => { const { error } = await sb.auth.signInWithPassword({ email: $('email').value, password: $('password').value }); if (error) $('login-error').textContent = error.message; else location.reload(); };
$('signout').onclick = async () => { await sb.auth.signOut(); location.reload(); };
start();
</script>
</body>
</html>
